"organelle-nucleus":["nucleolus","A dark spot inside the nucleus that makes parts of ribosomes.","The nucleolus is inside the nucleus.","nucléolo","নিউক্লিওলাস","核仁"],
"er":["endoplasmic reticulum (ER)","A network of membranes. Rough ER makes proteins. Smooth ER makes lipids.","Liver cells have a lot of smooth ER.","retículo endoplasmático","এন্ডোপ্লাজমিক রেটিকুলাম","内质网"],
"golgi":["Golgi apparatus","An organelle that changes, sorts, and packs proteins. It is like a post office.","The Golgi sends proteins to the right place.","aparato de Golgi","গলজি বস্তু","高尔基体"],
"mitochondria":["mitochondria","Organelles that make most of the cell's ATP using oxygen.","Muscle cells have many mitochondria.","mitocondrias","মাইটোকন্ড্রিয়া","线粒体"],
"lysosome":["lysosome","An organelle with enzymes that break down waste and old parts.","Lysosomes clean up inside the cell.","lisosoma","লাইসোসোম","溶酶体"],
"cilia":["cilia","Short hair-like parts on some cells. They move together like waves.","Cilia in the airways push mucus up.","cilios","সিলিয়া","纤毛"],
"cytoskeleton":["cytoskeleton","A network of protein fibers that gives the cell its shape and helps it move.","The cytoskeleton is like the cell's frame.","citoesqueleto","সাইটোস্কেলেটন","细胞骨架"],
"macromolecule":["macromolecule","A very large molecule made of many small units.","Proteins are macromolecules.","macromolécula","বৃহৎ অণু","大分子"],
"monomer":["monomer","One small unit that joins with others to make a large molecule.","Glucose is a monomer of starch.","monómero","মনোমার","单体"],
"carbohydrate":["carbohydrate","Sugars and starches. The body's main quick energy source.","Bread and rice are rich in carbohydrates.","carbohidrato","শর্করা","碳水化合物"],
"glucose":["glucose","A simple sugar. Cells use it for energy.","Blood carries glucose to all cells.","glucosa","গ্লুকোজ","葡萄糖"],
"glycogen":["glycogen","The way animals store glucose, mostly in the liver and muscles.","The liver breaks down glycogen when blood sugar is low.","glucógeno","গ্লাইকোজেন","糖原"],
"lipid":["lipid","Fats, oils, phospholipids, and steroids. They do not mix with water.","Butter is mostly lipid.","lípido","লিপিড","脂质"],
"amino-acid":["amino acid","The building block of proteins. There are 20 kinds.","Proteins are long chains of amino acids.","aminoácido","অ্যামিনো অ্যাসিড","氨基酸"],
"enzyme":["enzyme","A protein that makes a chemical reaction happen faster. It is not used up.","Amylase is an enzyme in saliva.","enzima","এনজাইম","酶"],
"denature":["denature","When a protein loses its shape and stops working, for example from heat or acid.","Cooking an egg denatures its proteins.","desnaturalizar","প্রোটিনের গঠন নষ্ট হওয়া","变性"],
"nucleotide":["nucleotide","The building block of DNA and RNA: a sugar, a phosphate, and a base.","DNA is a long chain of nucleotides.","nucleótido","নিউক্লিওটাইড","核苷酸"],
"gene":["gene","A part of DNA that has the instructions for one protein (or RNA).","The gene for hemoglobin is on chromosome 11.","gen","জিন","基因"],
"base-pair":["base pair","Two DNA bases joined in the middle of the ladder: A with T, and C with G.","A always pairs with T in DNA.","par de bases","বেস জোড়","碱基对"],
"replication":["DNA replication","Copying DNA before a cell divides.","DNA replication happens in the S phase.","replicación del ADN","ডিএনএ প্রতিলিপন","DNA复制"],
"transcription":["transcription","Making an mRNA copy of a gene. It happens in the nucleus.","Transcription makes mRNA from DNA.","transcripción","ট্রান্সক্রিপশন","转录"],
"translation":["translation","Building a protein by reading mRNA. It happens at the ribosome.","During translation, tRNA brings amino acids.","traducción","ট্রান্সলেশন","翻译"],
"codon":["codon","Three mRNA bases that stand for one amino acid (or 'stop').","AUG is the start codon.","codón","কোডন","密码子"],
"mutation":["mutation","A change in the DNA sequence.","A mutation in one gene causes sickle cell disease.","mutación","মিউটেশন","突变"],
"chromosome":["chromosome","A long, tightly packed piece of DNA. Humans have 46 in most cells.","Each chromosome has many genes.","cromosoma","ক্রোমোজোম","染色体"],
"mitosis":["mitosis","Cell division that makes two identical cells.","Skin heals by mitosis.","mitosis","মাইটোসিস","有丝分裂"],
"meiosis":["meiosis","Cell division that makes sex cells (sperm and eggs) with half the chromosomes.","Meiosis makes cells with 23 chromosomes.","meiosis","মিয়োসিস","减数分裂"],
"diploid":["diploid","Having two sets of chromosomes (46 in humans).","Skin cells are diploid.","diploide","ডিপ্লয়েড","二倍体"],
"haploid":["haploid","Having one set of chromosomes (23 in humans).","Sperm and eggs are haploid.","haploide","হ্যাপ্লয়েড","单倍体"],
"gamete":["gamete","A sex cell: a sperm or an egg.","Gametes are made by meiosis.","gameto","জননকোষ","配子"],
"allele":["allele","One version of a gene.","The gene for flower color has a purple allele and a white allele.","alelo","অ্যালিল","等位基因"],
"dominant":["dominant","An allele that shows its trait even when only one copy is present.","Purple flowers (P) are dominant in peas.","dominante","প্রকট","显性"],
"recessive":["recessive","An allele that shows its trait only when there are two copies.","White flowers (pp) are recessive.","recesivo","প্রচ্ছন্ন","隐性"],
"genotype":["genotype","The alleles a person has, like Aa.","Her genotype is Bb.","genotipo","জিনোটাইপ","基因型"],
"phenotype":["phenotype","The trait you can see or measure, like flower color.","The phenotype is purple flowers.","fenotipo","ফিনোটাইপ","表现型"],
"homozygous":["homozygous","Having two of the same alleles, like AA or aa.","A plant with PP is homozygous.","homocigoto","হোমোজাইগাস","纯合子"],
"heterozygous":["heterozygous","Having two different alleles, like Aa. Also called a carrier for recessive conditions.","A carrier of cystic fibrosis is heterozygous.","heterocigoto","হেটেরোজাইগাস","杂合子"],
"punnett":["Punnett square","A grid that shows the possible allele combinations in children.","Use a Punnett square to predict the chances.","cuadro de Punnett","পানেট বর্গ","庞纳特方格"],
"pathogen":["pathogen","A germ that can cause disease.","Some bacteria are pathogens.","patógeno","রোগজীবাণু","病原体"],
"bacteria":["bacteria","Single-celled prokaryotes. Most are harmless. Some cause disease.","Strep throat is caused by bacteria.","bacterias","ব্যাকটেরিয়া","细菌"],
"virus":["virus","A tiny germ that is not a cell. It needs a host cell to make copies of itself.","The flu is caused by a virus.","virus","ভাইরাস","病毒"],
"fungi":["fungi","Yeasts, molds, and mushrooms. They are eukaryotes.","Athlete's foot is caused by fungi.","hongos","ছত্রাক","真菌"],
"antibiotic":["antibiotic","A medicine that kills bacteria or stops them from growing. It does not work on viruses.","Penicillin is an antibiotic.","antibiótico","অ্যান্টিবায়োটিক","抗生素"],
"chain-of-infection":["chain of infection","The six links that let an infection spread from one person to another.","Hand washing breaks the chain of infection.","cadena de infección","সংক্রমণ শৃঙ্খল","感染链"],
"microbiota":["normal microbiota","The helpful microbes that live on and in a healthy body.","Gut bacteria are part of our normal microbiota.","microbiota normal","স্বাভাবিক অণুজীব","正常菌群"]
});

CHAPTERS.push(
{id:"c6",num:6,unit:2,teas:"S.2.1",emoji:"🏭",title:"Inside the Cell: Organelles",min:14,
 src:["Biology 2e, 4.3 Eukaryotic Cells, 4.4 The Endomembrane System, 4.5 The Cytoskeleton","https://openstax.org/details/books/biology-2e"],
 goals:["name the main organelles and their jobs","follow a protein from the ribosome to outside the cell","compare plant and animal cells"],
 lang:"I can describe an organelle using 'It is like a… because…'.",
 sections:[
 {id:"s1",h:"The nucleus: the control center",s:["The [[nucleus]] holds the cell's [[dna|DNA]].","It has a double membrane called the nuclear envelope. Small holes (pores) let molecules in and out.","Inside the nucleus is the [[organelle-nucleus|nucleolus]]. It makes parts of [[ribosome|ribosomes]]."],
  m:["Most of the time, DNA is loose and called chromatin. Before a cell divides, it packs tightly into [[chromosome|chromosomes]].","Mature red blood cells have no nucleus. This gives them more room for hemoglobin."],
  an:"The nucleus is like the main office of a factory. It keeps the instructions safe and sends out copies."},
 {id:"s2",h:"The protein factory: ribosomes, ER, and Golgi",s:["[[ribosome|Ribosomes]] build proteins.","Rough [[er|ER]] has ribosomes on it. It makes proteins that will leave the cell or go into membranes.","Smooth ER has no ribosomes. It makes lipids and helps break down drugs and toxins.","The [[golgi|Golgi apparatus]] changes, sorts, and packs proteins into vesicles. Then it sends them where they need to go."],
  m:["Liver cells have a lot of smooth ER because they break down drugs and alcohol.","In muscle cells, a special smooth ER stores calcium. Muscles need calcium to contract."],
  an:"The Golgi is like a post office. It puts packages in boxes, adds a label, and ships them.",
  flow:["A ribosome on the rough ER builds the protein","The protein is folded inside the ER","A vesicle carries it to the Golgi","The Golgi changes, sorts, and packs it","A new vesicle carries it to the cell membrane","Exocytosis releases it outside the cell"]},
 {id:"s3",h:"Energy: mitochondria and chloroplasts",s:["[[mitochondria|Mitochondria]] make most of the cell's [[atp|ATP]]. They use glucose and oxygen. This is called cellular respiration.","Cells that work hard, like muscle and heart cells, have many mitochondria.","Plant cells also have chloroplasts. Chloroplasts use sunlight to make sugar (photosynthesis)."],
  m:["Mitochondria have their own DNA and a double membrane.","You get your mitochondria (and their DNA) from your mother's egg."],
  chk:["Which organelle makes most of the cell's ATP?",["Mitochondria","Golgi apparatus","Nucleolus"],0,"Mitochondria use oxygen and glucose to make ATP."]},
 {id:"s4",h:"Clean-up and storage",s:["[[lysosome|Lysosomes]] have strong enzymes. They break down waste, old organelles, and germs that the cell eats.","Peroxisomes break down fatty acids and some toxins, like alcohol.","Vacuoles store water and other materials. Plant cells have one large central vacuole."],
  m:["White blood cells use lysosomes to digest the bacteria they eat.","Peroxisomes make hydrogen peroxide and then break it down safely."]},
 {id:"s5",h:"Shape and movement",s:["The [[cytoskeleton]] is a network of protein fibers. It gives the cell its shape and moves things inside it.","[[cilia|Cilia]] are short 'hairs' that move like waves. In your airways, they push mucus and dirt up and out.","A flagellum is a long tail. A sperm cell swims with one flagellum."],
  nl:"Smoking damages the cilia in the airways. Mucus and germs then stay in the lungs, so smokers get more lung infections.",
  tbl:[["Feature","Animal cell","Plant cell"],[["Cell wall","No","Yes (cellulose)"],["Chloroplasts","No","Yes"],["Vacuole","Small or none","One large central vacuole"],["Centrioles","Yes","Usually no"],["Shape","Round or irregular","Box-like"]]]}
 ],
 say:["The nucleus ___. Mitochondria ___. The Golgi ___.","The nucleus holds the DNA. Mitochondria make most of the cell's ATP. The Golgi changes, sorts, and packs proteins."],
 quiz:[
 ["c6q1","s1","mc","Where is DNA mainly kept in a human cell?",["In the nucleus","In the Golgi apparatus","In the lysosome","In the cell wall"],0,"The nucleus holds the DNA. (A little DNA is also in mitochondria.)","nucleus"],
 ["c6q2","s2","mc","Which organelle builds proteins?",["Ribosome","Lysosome","Vacuole","Smooth ER"],0,"Ribosomes read instructions and build proteins.","ribosome"],
 ["c6q3","s2","mc","Which organelle changes, sorts, and packs proteins?",["Golgi apparatus","Mitochondrion","Nucleolus","Centriole"],0,"The Golgi works like a post office.","golgi"],
 ["c6q4","s2","mc","Liver cells break down many drugs. Which organelle do they have a lot of?",["Smooth ER","Chloroplasts","Cell walls","Flagella"],0,"Smooth ER helps break down drugs and toxins.","er"],
 ["c6q5","s3","mc","Heart muscle cells work all the time. What do they have many of?",["Mitochondria","Chloroplasts","Vacuoles","Cell walls"],0,"Hard-working cells need lots of ATP, so they have many mitochondria.","mitochondria"],
 ["c6q6","s4","mc","Which organelle uses enzymes to break down waste and germs?",["Lysosome","Ribosome","Golgi apparatus","Nucleus"],0,"Lysosomes are the cell's clean-up crew.","lysosome"],
 ["c6q7","s5","mc","What do cilia in the airways do?",["Push mucus and dirt up and out","Make ATP","Store water","Make hormones"],0,"Cilia move like waves and push mucus out of the airways.","cilia"],
 ["c6q8","s5","mc","Which structure do plant cells have but animal cells do not?",["A cell wall","A cell membrane","Ribosomes","Mitochondria"],0,"Both have membranes, ribosomes, and mitochondria. Only plant cells have a cell wall.","cell"]
 ]},

{id:"c7",num:7,unit:2,teas:"S.2.4",emoji:"🍞",title:"The Molecules of Life",min:15,
 src:["Biology 2e, Chapter 3 Biological Macromolecules","https://openstax.org/details/books/biology-2e"],
 goals:["name the four kinds of macromolecules and their building blocks","give one job for each kind","explain how enzymes work"],
 lang:"I can compare two macromolecules using 'Both… but…'.",
 sections:[
 {id:"s1",h:"Four big molecules",s:["Living things are made of four kinds of [[macromolecule|macromolecules]]: carbohydrates, lipids, proteins, and nucleic acids.","Each one is built from small units called [[monomer|monomers]]. Many monomers join to make a polymer.","To join monomers, the cell removes a water molecule. To break them apart, the cell adds water."],
  m:["Joining by removing water is called dehydration synthesis. Breaking apart by adding water is called hydrolysis.","These molecules are built on carbon, so they are called organic molecules."],
  an:"Monomers are like beads. A polymer is a necklace made of many beads.",
  tbl:[["Macromolecule","Building block","Main jobs"],[["Carbohydrate","Monosaccharide (like glucose)","Quick energy, energy storage, structure (fiber)"],["Lipid","Glycerol and fatty acids (for fats)","Long-term energy storage, membranes, hormones, insulation"],["Protein","Amino acid","Enzymes, structure, transport, defense, movement"],["Nucleic acid","Nucleotide","Store and use genetic information"]]]},
 {id:"s2",h:"Carbohydrates",s:["[[carbohydrate|Carbohydrates]] are sugars and starches. They are the body's main source of quick energy.","Simple sugars include [[glucose]], fructose, and galactose. Two sugars together make a disaccharide, like table sugar (sucrose) or milk sugar (lactose).","Long chains are polysaccharides. Plants store energy as starch. Animals store energy as [[glycogen]] in the liver and muscles.","Cellulose makes plant cell walls. We cannot digest it, but it is useful fiber."],
  m:["Carbohydrates contain carbon, hydrogen, and oxygen, usually in a 1:2:1 ratio. Glucose is C₆H₁₂O₆."]},
 {id:"s3",h:"Lipids",s:["[[lipid|Lipids]] do not mix with water.","Fats store a lot of energy for a long time. They also keep the body warm and protect organs.","Phospholipids build cell membranes.","Steroids are lipids too. Cholesterol and hormones like estrogen and testosterone are steroids."],
  m:["A fat molecule (triglyceride) is one glycerol plus three fatty acids.","Saturated fats have no double bonds. They are usually solid at room temperature, like butter. Unsaturated fats have double bonds and are usually liquid, like olive oil.","One gram of fat gives about 9 calories. One gram of carbohydrate or protein gives about 4."]},
 {id:"s4",h:"Proteins and enzymes",s:["Proteins are chains of [[amino-acid|amino acids]]. There are 20 kinds of amino acids.","A protein's shape decides its job. Proteins work as enzymes, build structures (like collagen and keratin), carry things (like hemoglobin), fight germs (antibodies), send signals (like insulin), and move muscles.","[[enzyme|Enzymes]] are proteins that speed up chemical reactions. Each enzyme fits only certain molecules, like a lock and key. Enzymes are not used up.","High heat or the wrong pH can [[denature]] a protein. It loses its shape and stops working."],
  m:["Amino acids are joined by peptide bonds. A chain of amino acids is called a polypeptide.","The molecule an enzyme works on is its substrate. It fits in the enzyme's active site.","Enzymes speed up reactions by lowering the activation energy."],
  nl:"A very high fever can start to denature the body's proteins, including enzymes. This is one reason very high fevers are dangerous.",
  chk:["What happens to an enzyme after it helps a reaction?",["It can be used again","It is used up","It turns into a lipid"],0,"Enzymes are not used up. One enzyme can work many times."]},
 {id:"s5",h:"Nucleic acids",s:["Nucleic acids are DNA and RNA.","They are built from [[nucleotide|nucleotides]]. Each nucleotide has a sugar, a phosphate group, and a base.","DNA stores genetic information. RNA uses that information to build proteins."],
  m:["ATP, the cell's energy molecule, is also a nucleotide."]}
 ],
 say:["Carbohydrates are made of ___ and are used for ___. Proteins are made of ___. Enzymes are ___.","Carbohydrates are made of simple sugars and are used for quick energy. Proteins are made of amino acids. Enzymes are proteins that speed up reactions and are not used up."],
 quiz:[
 ["c7q1","s4","mc","What are the building blocks of proteins?",["Amino acids","Nucleotides","Fatty acids","Simple sugars"],0,"Proteins are chains of amino acids.","amino-acid"],
 ["c7q2","s2","mc","How do animals store glucose?",["As glycogen","As cellulose","As starch","As DNA"],0,"Animals store glucose as glycogen in the liver and muscles. Plants use starch.","glycogen"],
 ["c7q3","s3","mc","Which molecule is a lipid?",["Cholesterol","Glucose","Hemoglobin","DNA"],0,"Cholesterol is a steroid, which is a kind of lipid.","lipid"],
 ["c7q4","s4","mc","What does an enzyme do?",["Speeds up a chemical reaction","Stores genetic information","Makes the cell wall","Carries oxygen in plants"],0,"Enzymes are proteins that make reactions faster.","enzyme"],
 ["c7q5","s4","mc","A protein is heated and loses its shape. What happened?",["It was denatured","It was replicated","It became a carbohydrate","It became a gene"],0,"Heat and wrong pH can denature proteins, so they stop working.","denature"],
 ["c7q6","s5","mc","What are the building blocks of DNA and RNA?",["Nucleotides","Amino acids","Glycerol molecules","Monosaccharides"],0,"Nucleic acids are chains of nucleotides.","nucleotide"],
 ["c7q7","s2","mc","Which is the body's main source of quick energy?",["Carbohydrates","Nucleic acids","Steroids","Cellulose"],0,"Cells use glucose from carbohydrates first for quick energy.","carbohydrate"],
 ["c7q8","s1","mc","How does a cell join two monomers?",["It removes a water molecule","It adds a water molecule","It adds oxygen","It adds DNA"],0,"Dehydration synthesis removes water. Hydrolysis adds water to break bonds.","monomer"],
 ["c7q9","s3","tf","True or false: Saturated fats like butter are usually solid at room temperature.",null,true,"Saturated fats have no double bonds, so they pack tightly and are solid.","lipid"]
 ]},

{id:"c8",num:8,unit:2,teas:"S.2.2",emoji:"🧬",title:"DNA, RNA, and Proteins",min:16,
 src:["Biology 2e, Chapter 14 DNA Structure and Function and Chapter 15 Genes and Proteins","https://openstax.org/details/books/biology-2e"],
 goals:["describe the structure of DNA and the base-pair rules","explain transcription and translation","explain how a mutation can change a protein"],
 lang:"I can explain the steps from DNA to protein using 'first', 'next', and 'finally'.",
 sections:[
 {id:"s1",h:"The structure of DNA",s:["DNA is shaped like a twisted ladder. This shape is called a double helix.","The sides of the ladder are sugar and phosphate. The steps are pairs of bases.","There are four bases: A (adenine), T (thymine), C (cytosine), and G (guanine).","The [[base-pair|base-pair]] rule: A always pairs with T. C always pairs with G.","A [[gene]] is a section of DNA with the instructions for one protein."],
  m:["James Watson and Francis Crick described the double helix in 1953. Their model used X-ray images made by Rosalind Franklin and Maurice Wilkins.","The two strands are held together by hydrogen bonds between the bases. The sugar in DNA is deoxyribose."],
  tip:"Memory trick: Apples in the Tree, Cars in the Garage. A–T, C–G.",
  chk:["One DNA strand reads A T G C. What is the matching strand?",["T A C G","A T G C","U A C G"],0,"A pairs with T, and C pairs with G. So A T G C matches T A C G."]},
 {id:"s2",h:"Copying DNA",s:["Before a cell divides, it copies all its DNA. This is [[replication|DNA replication]].","First, the two strands unzip.","Next, each old strand is a pattern. An enzyme called DNA polymerase adds matching nucleotides.","Finally, there are two DNA molecules. Each one has one old strand and one new strand."],
  m:["The enzyme helicase unzips the DNA.","Because each new DNA keeps one old strand, replication is called semiconservative."]},
 {id:"s3",h:"RNA: DNA's helper",s:["RNA is a copy of part of the DNA message.","RNA is different from DNA in three ways: it has one strand, its sugar is ribose, and it uses U (uracil) instead of T.","There are three main kinds: mRNA (messenger) carries the message, tRNA (transfer) brings amino acids, and rRNA is part of ribosomes."],
  tbl:[["","DNA","RNA"],[["Strands","Two (double helix)","One"],["Sugar","Deoxyribose","Ribose"],["Bases","A, T, C, G","A, U, C, G"],["Where","Mostly in the nucleus","Nucleus and cytoplasm"],["Job","Stores the instructions","Uses the instructions to build proteins"]]]},
 {id:"s4",h:"From gene to protein",s:["Step 1 is [[transcription]]. In the nucleus, an enzyme makes an mRNA copy of a gene.","The mRNA leaves the nucleus and goes to a ribosome.","Step 2 is [[translation]]. The ribosome reads the mRNA three bases at a time. Each group of three is a [[codon]].","tRNA molecules bring the right amino acid for each codon. The amino acids join into a chain, which folds into a protein."],
  m:["In DNA-to-RNA base pairing, A in DNA pairs with U in RNA.","The start codon is AUG. Three stop codons (UAA, UAG, UGA) tell the ribosome to stop.","In eukaryotes, parts of the first mRNA (introns) are cut out before it leaves the nucleus. This is called splicing.","This flow of information, DNA → RNA → protein, is called the central dogma of biology."],
  flow:["Transcription: DNA is copied into mRNA in the nucleus","mRNA leaves the nucleus","A ribosome reads the mRNA codons","tRNA brings the matching amino acids","Amino acids join into a chain","The chain folds into a working protein"]},
 {id:"s5",h:"Mutations",s:["A [[mutation]] is a change in the DNA sequence.","A mutation can change one amino acid, or many. This can change the protein's shape and job.","Some mutations are harmless. Some cause disease. A few are helpful."],
  m:["Sickle cell disease is caused by a change in one DNA base in the hemoglobin gene. This changes one amino acid (glutamic acid becomes valine), and red blood cells can bend into a sickle shape.","Mutations can happen by mistake during copying, or from things like UV light, radiation, and some chemicals."],
  nl:"Sunscreen helps prevent skin cancer because UV light can cause mutations in skin cell DNA."}
 ],
 say:["DNA is copied into ___ in the ___. Then the ___ reads the codons and ___ brings amino acids.","DNA is copied into mRNA in the nucleus. Then the ribosome reads the codons and tRNA brings amino acids."],
 quiz:[
 ["c8q1","s1","mc","In DNA, adenine (A) always pairs with…",["Thymine (T)","Cytosine (C)","Guanine (G)","Uracil (U)"],0,"A pairs with T, and C pairs with G.","base-pair"],
 ["c8q2","s1","mc","A DNA strand reads G G A T. What is the matching DNA strand?",["C C T A","C C U A","G G A T","T T C G"],0,"G matches C, A matches T, T matches A.","base-pair"],
 ["c8q3","s3","mc","Which base is found in RNA but not in DNA?",["Uracil (U)","Thymine (T)","Adenine (A)","Guanine (G)"],0,"RNA uses uracil instead of thymine.","nucleotide"],
 ["c8q4","s4","mc","What is transcription?",["Making mRNA from DNA","Making a protein from mRNA","Copying all the DNA","Cutting a cell in two"],0,"Transcription makes an mRNA copy of a gene in the nucleus.","transcription"],
 ["c8q5","s4","mc","Where does translation happen?",["At a ribosome","In the nucleolus","In the lysosome","In the cell wall"],0,"Ribosomes read mRNA and build proteins.","translation"],
 ["c8q6","s4","mc","How many mRNA bases make one codon?",["Three","One","Two","Four"],0,"A codon is three bases. Each codon stands for one amino acid or 'stop'.","codon"],
 ["c8q7","s2","mc","After DNA replication, each new DNA molecule has…",["one old strand and one new strand","two new strands","two old strands","only RNA"],0,"Replication is semiconservative: one old strand stays in each new molecule.","replication"],
 ["c8q8","s5","mc","Sickle cell disease is caused by…",["a change in one base of the hemoglobin gene","a virus","too much vitamin C","a broken bone"],0,"One base change changes one amino acid in hemoglobin.","mutation"],
 ["c8q9","s3","tf","True or false: tRNA brings amino acids to the ribosome.",null,true,"Transfer RNA (tRNA) carries the matching amino acid for each codon.","translation"]
 ]},

{id:"c9",num:9,unit:2,teas:"S.2.1",emoji:"✂️",title:"Cell Division: Mitosis and Meiosis",min:15,
 src:["Biology 2e, Chapter 10 Cell Reproduction and Chapter 11 Meiosis and Sexual Reproduction","https://openstax.org/details/books/biology-2e"],
 goals:["describe the cell cycle","put the stages of mitosis in order","compare mitosis and meiosis"],
 lang:"I can compare mitosis and meiosis using 'In mitosis… but in meiosis…'.",
 sections:[
 {id:"s1",h:"The cell cycle",s:["The cell cycle is the life of a cell from one division to the next.","Most of the time, the cell is in interphase. It grows, does its job, and copies its DNA.","Then comes the mitotic phase: the nucleus divides (mitosis) and the cytoplasm divides (cytokinesis)."],
  m:["Interphase has three parts: G1 (growth), S (DNA is copied, or synthesized), and G2 (more growth and getting ready).","Some cells, like most nerve cells, stop dividing and stay in a resting stage called G0."]},
 {id:"s2",h:"Mitosis: one cell becomes two",s:["Human body cells have 46 [[chromosome|chromosomes]] (23 pairs). They are [[diploid]].","[[mitosis|Mitosis]] makes two new cells. Each one has the same 46 chromosomes as the first cell.","Mitosis is used for growth and to repair or replace cells, like healing skin."],
  m:["Prophase: chromosomes pack tightly, the nuclear envelope breaks down, and spindle fibers form.","Metaphase: chromosomes line up in the middle of the cell.","Anaphase: the two copies of each chromosome (sister chromatids) are pulled to opposite ends.","Telophase: two new nuclei form. Then cytokinesis splits the cell in two."],
  tip:"PMAT: Prophase, Metaphase (Middle), Anaphase (Apart), Telophase (Two).",
  flow:["Prophase: chromosomes condense and the spindle forms","Metaphase: chromosomes line up in the middle","Anaphase: sister chromatids are pulled apart","Telophase: two new nuclei form","Cytokinesis: the cytoplasm splits into two cells"]},
 {id:"s3",h:"Meiosis: making sex cells",s:["[[meiosis|Meiosis]] makes [[gamete|gametes]]: sperm and eggs.","It has two divisions, so one cell becomes four cells.","Each new cell has 23 chromosomes, half the normal number. These cells are [[haploid]].","When a sperm (23) joins an egg (23), the new cell has 46 again."],
  m:["Meiosis makes cells that are all genetically different.","In crossing over, matching chromosomes swap pieces. In independent assortment, each pair lines up in a random way. Both add variety."],
  tbl:[["","Mitosis","Meiosis"],[["Purpose","Growth and repair","Making sperm and eggs"],["Divisions","One","Two"],["Cells made","2","4"],["Chromosomes in each new human cell","46 (diploid)","23 (haploid)"],["Same as the first cell?","Yes, identical","No, all different"]]],
  chk:["A human egg cell has how many chromosomes?",["23","46","92"],0,"Gametes are haploid, with 23 chromosomes."]},
 {id:"s4",h:"When division goes wrong",s:["The cell cycle has checkpoints. They stop the cycle if DNA is damaged.","Cancer happens when cells divide without control. They can form a lump called a tumor.","Sometimes chromosomes do not separate correctly during meiosis. Then a gamete has an extra or missing chromosome."],
  m:["When chromosomes fail to separate, it is called nondisjunction.","Down syndrome (trisomy 21) happens when a person has three copies of chromosome 21."],
  nl:"Many chemotherapy drugs attack dividing cells. Healthy cells that divide fast, like hair follicles and the lining of the gut, are also hurt. This causes side effects like hair loss and nausea."}
 ],
 say:["Mitosis makes ___ cells that are ___. Meiosis makes ___ cells with ___ chromosomes.","Mitosis makes two cells that are identical. Meiosis makes four cells with 23 chromosomes."],
 quiz:[
 ["c9q1","s2","mc","What is the correct order of mitosis?",["Prophase, metaphase, anaphase, telophase","Metaphase, prophase, telophase, anaphase","Anaphase, prophase, metaphase, telophase","Telophase, anaphase, metaphase, prophase"],0,"Remember PMAT.","mitosis"],
 ["c9q2","s2","mc","In which stage do chromosomes line up in the middle of the cell?",["Metaphase","Prophase","Anaphase","Telophase"],0,"Metaphase = middle.","mitosis"],
 ["c9q3","s1","mc","When is DNA copied?",["During interphase (S phase)","During anaphase","During cytokinesis","Only during meiosis"],0,"DNA is copied in the S phase of interphase, before mitosis begins.","replication"],
 ["c9q4","s3","mc","What does meiosis make?",["Sperm and egg cells","Skin cells","Red blood cells","Bone cells"],0,"Meiosis makes gametes.","meiosis"],
 ["c9q5","s3","mc","How many cells does meiosis make from one cell?",["Four","Two","One","Eight"],0,"Meiosis has two divisions, so one cell becomes four.","meiosis"],
 ["c9q6","s2","mc","Why does your body use mitosis?",["For growth and repair","To make sperm and eggs","To make RNA","To digest food"],0,"Mitosis makes identical cells to grow and to replace damaged cells.","mitosis"],
 ["c9q7","s4","mc","What is cancer?",["Cells dividing without control","Cells that stop making ATP","A type of virus","Cells with no DNA"],0,"Cancer cells ignore the cell cycle checkpoints and keep dividing.","mitosis"],
 ["c9q8","s3","mc","A cell with 23 chromosomes (one set) is called…",["haploid","diploid","heterozygous","prokaryotic"],0,"Haploid = one set. Diploid = two sets.","haploid"],
 ["c9q9","s4","tf","True or false: Down syndrome is caused by an extra copy of chromosome 21.",null,true,"Trisomy 21 means three copies of chromosome 21.","chromosome"]
 ]},

{id:"c10",num:10,unit:2,teas:"S.2.3",emoji:"🌸",title:"Heredity: Mendel's Laws",min:16,
 src:["Biology 2e, Chapter 12 Mendel's Experiments and Heredity","https://openstax.org/details/books/biology-2e"],
 goals:["use the words allele, dominant, recessive, genotype, and phenotype","solve a Punnett square","describe patterns beyond simple dominance"],
 lang:"I can explain a Punnett square result using 'There is a … in 4 chance that…'.",
 sections:[
 {id:"s1",h:"Genes and alleles",s:["A gene controls a trait, like flower color.","An [[allele]] is one version of a gene. For example, purple or white.","You get one allele from each parent, so you have two alleles for each gene.","A [[dominant]] allele shows its trait even with one copy. We write it with a capital letter (P).","A [[recessive]] allele shows its trait only with two copies. We write it with a small letter (p)."],
  m:["Gregor Mendel studied pea plants in the 1850s and 1860s. He published his results in 1866. He is called the father of genetics."]},
 {id:"s2",h:"Genotype and phenotype",s:["[[genotype|Genotype]] means the alleles: PP, Pp, or pp.","[[phenotype|Phenotype]] means the trait you can see: purple or white.","[[homozygous|Homozygous]] means two of the same alleles (PP or pp).","[[heterozygous|Heterozygous]] means two different alleles (Pp)."],
  tbl:[["Genotype","Name","Phenotype (pea flowers)"],[["PP","Homozygous dominant","Purple"],["Pp","Heterozygous","Purple (the P hides the p)"],["pp","Homozygous recessive","White"]]],
  chk:["A pea plant is Pp. What color are its flowers?",["Purple","White","Pink"],0,"Purple (P) is dominant, so one P is enough."]},
 {id:"s3",h:"Punnett squares",s:["A [[punnett|Punnett square]] shows all the possible allele combinations for a child.","Put one parent's alleles on top and the other parent's alleles on the side. Fill each box with one letter from the top and one from the side.","Each box is a 1 in 4 (25%) chance."],
  m:["Pp × Pp gives 1 PP : 2 Pp : 1 pp. So 3 of 4 are purple and 1 of 4 is white (a 3:1 phenotype ratio).","A cross with one gene is called a monohybrid cross."],
  vis:"punnett"},
 {id:"s4",h:"Mendel's laws",s:["The law of segregation: your two alleles separate when you make sperm or eggs. Each gamete gets only one allele.","The law of independent assortment: genes for different traits are passed on separately (when they are on different chromosomes).","These laws happen because of meiosis."],
  m:["Genes that are very close together on the same chromosome are often inherited together. They are called linked genes."]},
 {id:"s5",h:"Beyond simple dominance",s:["Incomplete dominance: the heterozygous trait is a blend. A red and a white snapdragon flower can have pink children.","Codominance: both alleles show fully. A person with blood type AB shows both A and B.","Multiple alleles: some genes have more than two alleles. The ABO blood gene has A, B, and O.","Sex-linked traits: genes on the X chromosome. Males have only one X, so X-linked recessive conditions, like hemophilia and red-green color blindness, are more common in males.","Polygenic traits: many genes together, like height and skin color."],
  nl:"Cystic fibrosis and sickle cell disease are autosomal recessive. If both parents are carriers (Aa), each pregnancy has a 1 in 4 chance of a child with the condition."}
 ],
 say:["A genotype is ___. A phenotype is ___. If both parents are Aa, the chance of aa is ___.","A genotype is the alleles a person has. A phenotype is the trait you can see. If both parents are Aa, the chance of aa is 1 in 4 (25%)."],
 quiz:[
 ["c10q1","s1","mc","What is an allele?",["One version of a gene","A whole chromosome","A type of protein","A sex cell"],0,"Alleles are versions of the same gene.","allele"],
 ["c10q2","s2","mc","Which genotype is heterozygous?",["Bb","BB","bb","None of these"],0,"Heterozygous means two different alleles.","heterozygous"],
 ["c10q3","s3","mc","Two Pp pea plants are crossed. What fraction of the children will have white flowers (pp)?",["1/4","1/2","3/4","0"],0,"Pp × Pp gives PP, Pp, Pp, pp. Only 1 of 4 is pp.","punnett"],
 ["c10q4","s3","mc","A PP plant is crossed with a pp plant. What will the children be?",["All Pp (purple)","All pp (white)","Half PP, half pp","3 purple : 1 white"],0,"Every child gets P from one parent and p from the other.","punnett"],
 ["c10q5","s2","mc","Phenotype means…",["the trait you can see","the letters of the alleles","the number of chromosomes","the type of cell division"],0,"Phenotype = what you see. Genotype = the alleles.","phenotype"],
 ["c10q6","s4","mc","Mendel's law of segregation says…",["each gamete gets only one allele for each gene","all genes are dominant","traits always blend","children get no genes from the father"],0,"The two alleles separate during meiosis.","allele"],
 ["c10q7","s5","mc","A person has blood type AB. This is an example of…",["codominance","incomplete dominance","a recessive trait","a polygenic trait"],0,"Both A and B show fully, so it is codominance.","dominant"],
 ["c10q8","s5","mc","Why is hemophilia more common in males?",["The gene is on the X chromosome, and males have only one X","Males have more chromosomes","It is caused by a virus","It is a dominant trait"],0,"With one X, a male with one recessive allele shows the condition.","recessive"],
 ["c10q9","s5","tf","True or false: Two carrier parents (Aa) of a recessive condition have a 25% chance with each pregnancy of a child with the condition.",null,true,"Aa × Aa gives aa in 1 of 4 boxes.","heterozygous"]
 ]},

{id:"c11",num:11,unit:2,teas:"S.2.5",emoji:"🦠",title:"Microorganisms and Disease",min:15,
 src:["OpenStax Microbiology (Parker, Schneegurt, Thi Tu, Lister & Forster)","https://openstax.org/details/books/microbiology"],
 goals:["compare bacteria, viruses, fungi, protozoa, and worms","describe the chain of infection","explain why antibiotics do not work on viruses"],
 lang:"I can describe how an infection spreads using the six links of the chain of infection.",
 sections:[
 {id:"s1",h:"Kinds of microbes",s:["Microbes (microorganisms) are living things too small to see without a microscope.","Most microbes are harmless or helpful. A germ that causes disease is a [[pathogen]].","Your body is home to trillions of helpful microbes. This is your [[microbiota|normal microbiota]]. Gut bacteria help digest food and make vitamin K."],
  tbl:[["Type","What it is","Example disease"],[["Bacteria","Single-celled prokaryotes","Strep throat, tuberculosis, UTIs"],["Viruses","Not cells: genetic material in a protein coat. They need a host cell to copy themselves.","Flu, COVID-19, HIV, measles"],["Fungi","Eukaryotes: yeasts and molds","Athlete's foot, thrush (Candida)"],["Protozoa","Single-celled eukaryotes","Malaria"],["Helminths","Parasitic worms (multicellular)","Tapeworm, pinworm"]]]},
 {id:"s2",h:"Bacteria and viruses up close",s:["[[bacteria|Bacteria]] have a cell wall, a membrane, ribosomes, and DNA, but no nucleus.","Bacteria come in shapes: round (cocci), rods (bacilli), and spirals (spirilla).","A [[virus]] is much smaller. It enters a host cell and uses the cell's parts to make new viruses. Then the new viruses leave and infect more cells."],
  m:["A Gram stain sorts bacteria into two groups. Gram-positive bacteria have a thick cell wall and stain purple. Gram-negative bacteria have a thin wall plus an outer membrane and stain pink.","Some bacteria make toxins. Toxins can cause illness even when there are not many bacteria."],
  chk:["Which kind of microbe is NOT a cell?",["Virus","Bacterium","Yeast (fungus)"],0,"Viruses are not cells. They must use a host cell to make copies."]},
 {id:"s3",h:"How infections spread: the chain of infection",s:["An infection spreads through six links. Break any link, and you stop the spread.","1. Infectious agent (the germ). 2. Reservoir (where it lives). 3. Portal of exit (how it leaves). 4. Mode of transmission (how it travels). 5. Portal of entry (how it gets in). 6. Susceptible host (a person who can get sick)."],
  m:["Ways germs travel: direct contact, droplets (coughs and sneezes, short distance), airborne (tiny particles that stay in the air, like tuberculosis and measles), vehicles (food, water, objects), and vectors (living carriers, like mosquitoes).","Louis Pasteur and Robert Koch helped prove the germ theory of disease in the 1800s."],
  flow:["Infectious agent: the germ","Reservoir: where the germ lives","Portal of exit: how it leaves the reservoir","Mode of transmission: how it travels","Portal of entry: how it enters a new person","Susceptible host: a person who can get sick"],
  nl:"Hand hygiene is one of the most important ways to prevent infections in hospitals. It breaks the 'mode of transmission' link."},
 {id:"s4",h:"Treating and preventing infections",s:["[[antibiotic|Antibiotics]] kill bacteria or stop them from growing. They do not work on viruses.","Antiviral drugs treat some viruses. Antifungal drugs treat fungi.","Antibiotic resistance happens when bacteria survive antibiotics and pass on that ability. Overusing antibiotics makes resistance more common. MRSA is an example of a resistant bacterium.","Vaccines prevent many infections by training the immune system ahead of time."],
  m:["Antibiotics target parts that bacteria have but human cells do not, like the bacterial cell wall. Viruses have no cell wall or ribosomes of their own, so antibiotics have nothing to attack."]}
 ],
 say:["Antibiotics work on ___ but not on ___ because ___.","Antibiotics work on bacteria but not on viruses because viruses are not cells and have no parts for antibiotics to attack."],
 quiz:[
 ["c11q1","s2","mc","What does a virus need to make copies of itself?",["A host cell","Sunlight","A cell wall","Its own ribosomes"],0,"Viruses are not cells, so they use a host cell's parts.","virus"],
 ["c11q2","s4","mc","Why do antibiotics not cure the flu?",["The flu is caused by a virus","The flu is caused by bacteria with thick walls","Antibiotics only work on fungi","The flu is not an infection"],0,"Antibiotics only work on bacteria.","antibiotic"],
 ["c11q3","s1","mc","Malaria is caused by…",["a protozoan","a virus","a fungus","a worm"],0,"Malaria is caused by Plasmodium, a single-celled protozoan spread by mosquitoes.","pathogen"],
 ["c11q4","s3","mc","A mosquito carries a germ from one person to another. The mosquito is a…",["vector","reservoir","portal of exit","susceptible host"],0,"A vector is a living carrier.","chain-of-infection"],
 ["c11q5","s3","mc","Which action breaks the mode-of-transmission link?",["Hand hygiene","Eating more sugar","Taking a vitamin","Sleeping more"],0,"Clean hands stop germs from traveling from person to person.","chain-of-infection"],
 ["c11q6","s4","mc","How does antibiotic resistance usually develop?",["Bacteria that survive antibiotics multiply and pass on their resistance","Viruses turn into bacteria","Patients become allergic","Vaccines stop working"],0,"Overuse gives resistant bacteria more chances to survive and spread.","antibiotic"],
 ["c11q7","s1","mc","What are normal microbiota?",["Helpful microbes that live on and in a healthy body","All pathogens","Viruses in the blood","Only fungi"],0,"Most of our microbes are helpful, like gut bacteria that make vitamin K.","microbiota"],
 ["c11q8","s2","mc","Gram-positive bacteria stain purple because they have…",["a thick cell wall","no cell wall","a nucleus","an outer membrane"],0,"The thick wall holds the purple dye.","bacteria"],
 ["c11q9","s1","tf","True or false: Fungi are eukaryotes.",null,true,"Yeasts and molds have a nucleus, so they are eukaryotes.","fungi"]
 ]}
);

"proximal":["proximal / distal","For arms and legs: proximal = closer to the trunk. Distal = farther from the trunk.","The elbow is proximal to the wrist.","proximal / distal","নিকটবর্তী / দূরবর্তী","近端 / 远端"],
"plane":["body plane","An imaginary flat cut through the body: sagittal, frontal, or transverse.","A transverse plane divides the body into top and bottom.","plano corporal","দেহতল","身体切面"],

"osteoclast":["osteoclast","A cell that breaks down bone and releases calcium.","Osteoclasts break down old bone.","osteoclasto","অস্টিওক্লাস্ট","破骨细胞"],
"bone-marrow":["bone marrow","Soft tissue inside bones. Red marrow makes blood cells. Yellow marrow stores fat.","Red bone marrow makes red blood cells.","médula ósea","অস্থিমজ্জা","骨髓"],
"ligament":["ligament","A strong band that connects bone to bone.","He tore a ligament in his knee.","ligamento","লিগামেন্ট","韧带"],
"tendon":["tendon","A strong cord that connects muscle to bone.","The Achilles tendon connects the calf muscle to the heel.","tendón","টেন্ডন","肌腱"],
"joint":["joint","A place where two bones meet.","The knee is a hinge joint.","articulación","অস্থিসন্ধি","关节"],

"sympathetic":["sympathetic nervous system","The 'fight or flight' part of the autonomic nervous system.","The sympathetic system raises heart rate.","sistema nervioso simpático","সিমপ্যাথেটিক স্নায়ুতন্ত্র","交感神经系统"],
"parasympathetic":["parasympathetic nervous system","The 'rest and digest' part of the autonomic nervous system.","The parasympathetic system slows the heart.","sistema nervioso parasimpático","প্যারাসিমপ্যাথেটিক স্নায়ুতন্ত্র","副交感神经系统"],
"cerebellum":["cerebellum","The part of the brain that controls balance and coordination.","The cerebellum helps you walk smoothly.","cerebelo","লঘুমস্তিষ্ক","小脑"],
