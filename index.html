<style>
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#1E2A2F; --soft:#52606A; --line:#E6DFD3;
  --teal:#0F766E; --teal-2:#E3F2EF; --coral:#C2410C; --coral-2:#FDEDE4;

}
html{font-size:18px}
html.size-l{font-size:21px}
html.size-xl{font-size:24px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.4rem;margin-right:auto}
.brand-dot{width:1.3rem;height:1.3rem;border-radius:50%;background:radial-gradient(circle at 60% 40%,#fff 0 22%,var(--teal) 24%);display:inline-block}

.nav a[aria-current="page"]{background:var(--teal-2);color:var(--teal);font-weight:700}
.badge{background:var(--coral);color:#fff;border-radius:999px;font-size:.7rem;padding:0 .4rem;margin-left:.2rem;vertical-align:top}
main{max-width:960px;margin:0 auto;padding:1.2rem 1rem 6rem;outline:none}
h1{font-size:1.75rem;line-height:1.25;margin:.4rem 0 .6rem}
h2{font-size:1.3rem;line-height:1.3;margin:0 0 .5rem}
h3{font-size:1.08rem;margin:0 0 .4rem}
p{margin:.35rem 0 .7rem}
.muted{color:var(--soft)}
.small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow);margin:0 0 1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:2px solid var(--teal);background:var(--teal);color:#fff;border-radius:12px;padding:.6rem 1.05rem;font-weight:700;text-decoration:none;min-height:46px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--teal)}
.btn.plain{border-color:var(--line);background:#fff;color:var(--ink);font-weight:400}
.btn.big{font-size:1.08rem;padding:.8rem 1.4rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.12rem .6rem;font-size:.82rem;background:var(--teal-2);color:var(--teal);font-weight:700}
.chip.gold{background:var(--sun-2);color:#9A4B00}
.chip.gray{background:#F1EEE8;color:var(--soft)}
.hero{background:linear-gradient(135deg,#E3F2EF,#FFF4E5);border:1px solid var(--line);border-radius:22px;padding:1.4rem 1.3rem;margin-bottom:1.2rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin-top:.9rem}
.step{background:#fff;border-radius:14px;padding:.6rem .8rem;border:1px solid var(--line);font-size:.92rem}
.step b{display:block;color:var(--teal)}
.ch-card{display:flex;flex-direction:column;gap:.4rem}
.ch-num{font-size:.8rem;color:var(--soft);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ch-emoji{font-size:1.8rem;line-height:1}
.ch-card .row{margin-top:auto}
.goals{background:var(--teal-2);border-radius:14px;padding:.8rem 1rem;margin:.6rem 0 1rem}
.goals ul{margin:.3rem 0 .2rem 1.1rem;padding:0}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 1rem}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:2px solid var(--teal);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--teal);padding:.45rem .8rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.sec-head{display:flex;align-items:flex-start;gap:.6rem;justify-content:space-between}
.listen{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .7rem;font-size:.85rem;white-space:nowrap;color:var(--ink)}
.listen.on{background:var(--purple-2);border-color:var(--purple);color:var(--purple)}
.term{border:0;background:none;padding:0;color:var(--purple);font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:3px;font-size:inherit;line-height:inherit}
.analogy{background:var(--sun-2);border-left:5px solid var(--sun);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
.tip{background:var(--purple-2);border-left:5px solid var(--purple);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
details.more{margin-top:.5rem;border-top:1px dashed var(--line);padding-top:.5rem}
details.more summary{cursor:pointer;color:var(--teal);font-weight:700}
.check{border:2px dashed var(--teal);border-radius:14px;padding:.8rem 1rem;margin-top:.8rem}
.opts{display:grid;gap:.55rem;margin:.6rem 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.7rem .9rem;min-height:50px;color:var(--ink);display:flex;gap:.6rem;align-items:center}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:#F1EEE8;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt.right{border-color:var(--green);background:var(--green-2)}
.opt.wrong{border-color:var(--coral);background:var(--coral-2)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:.7rem .9rem;margin-top:.5rem}
.fb.ok{background:var(--green-2)}
.fb.no{background:var(--coral-2)}
.bar{height:10px;background:#EFEAE1;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
.score{font-size:2.6rem;font-weight:700;color:var(--teal);line-height:1}
textarea,input[type=text],input[type=search],select{font:inherit;width:100%;border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:#fff;color:var(--ink)}
textarea{min-height:110px}
.frame{background:#F7F4EE;border-radius:10px;padding:.6rem .8rem;font-style:italic}
.viz{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem;margin:.8rem 0}
.viz svg{width:100%;height:auto;display:block}
.viz .cap{font-size:.92rem;margin:.4rem 0 0}
table.sum{width:100%;border-collapse:collapse;font-size:.92rem}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:.45rem .4rem;text-align:left;vertical-align:top}
table.sum th{background:#F7F4EE}
.word{display:flex;flex-direction:column;gap:.2rem}
.word .w{font-weight:700;font-size:1.1rem}
.word .tr{color:var(--purple);font-weight:700}
.hide-meaning .word .def,.hide-meaning .word .ex,.hide-meaning .word .tr{filter:blur(6px);transition:filter .2s}
.hide-meaning .word:hover .def,.hide-meaning .word:hover .ex,.hide-meaning .word:hover .tr,.hide-meaning .word.show .def,.hide-meaning .word.show .ex,.hide-meaning .word.show .tr{filter:none}
.pop{position:fixed;z-index:60;max-width:330px;background:#fff;border:2px solid var(--purple);border-radius:14px;padding:.8rem .9rem;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop .w{font-weight:700;font-size:1.1rem}
.fab{position:fixed;right:1rem;bottom:1rem;z-index:40;border-radius:999px;box-shadow:0 6px 20px rgba(15,118,110,.35)}
.drawer{position:fixed;top:0;right:0;bottom:0;height:100vh;height:100dvh;width:min(440px,100%);background:#fff;z-index:50;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.dr-head{padding:.8rem 1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem}
.dr-body{flex:1;overflow:auto;padding:.8rem 1rem}
.dr-foot{border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.5rem}
.msg{border-radius:14px;padding:.6rem .8rem;margin:.5rem 0;white-space:pre-wrap;font-size:.95rem}
.msg.you{background:var(--teal-2);margin-left:2rem}
.msg.tutor{background:#F7F4EE;margin-right:1rem}
.msg.sys{background:var(--sun-2);font-size:.88rem}
.quick{display:flex;flex-wrap:wrap;gap:.4rem}
.quick button{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;padding:.3rem .7rem;font-size:.85rem}
.quick button[disabled]{opacity:.5}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:70;font-size:.92rem}
.nurse{background:#E8F1FB;border-left:5px solid #1D6FD1;border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
ol.flow{margin:.5rem 0;padding:0;list-style:none;counter-reset:f}
ol.flow li{counter-increment:f;position:relative;padding:.45rem .7rem .45rem 2.6rem;background:#F7F4EE;border-radius:10px;margin-bottom:1.1rem}
ol.flow li::before{content:counter(f);position:absolute;left:.6rem;top:.45rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--teal);color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;font-weight:700}
ol.flow li:not(:last-child)::after{content:"↓";position:absolute;left:1rem;bottom:-1.15rem;color:var(--teal);font-weight:700}
ol.flow.done li{background:var(--green-2)}
table.pun{border-collapse:collapse;margin:.3rem 0}table.pun th,table.pun td{border:2px solid var(--line);padding:.5rem .9rem;text-align:center}table.pun td.pp{background:var(--purple-2)}table.pun td.ww{background:#fff}
.unit-head{margin:1.6rem 0 .6rem}.unit-head h2{margin:0}
.foot{max-width:960px;margin:0 auto;padding:0 1rem 2rem;font-size:.82rem;color:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.confirm{background:var(--coral-2);border-radius:12px;padding:.7rem .9rem;margin-top:.6rem}
@media (max-width:560px){.drawer{width:100%}.dr-body{padding:.6rem .8rem}.quick button{font-size:.8rem}.seg button{padding:.4rem .55rem;font-size:.88rem}h1{font-size:1.45rem}.card{padding:.95rem}.nav a{padding:.3rem .45rem;font-size:.85rem}.msg.you{margin-left:.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================
   DATA: glossary. [word, simple meaning, example, Spanish, Bengali, Chinese]
   ============================================================ */
const G={
"cell":["cell","The smallest living unit. All living things are made of cells.","Your skin is made of many cells.","célula","কোষ","细胞"],
"organism":["organism","A living thing.","A tree, a dog, and a bacterium are all organisms.","organismo","জীব","生物体"],
"microscope":["microscope","A tool that makes very small things look bigger.","We used a microscope to see onion cells.","microscopio","অণুবীক্ষণ যন্ত্র","显微镜"],
"cell-theory":["cell theory","Three main ideas about cells that all biologists agree on.","Cell theory says all living things are made of cells.","teoría celular","কোষ তত্ত্ব","细胞学说"],
"nucleus":["nucleus","A part inside some cells that holds the DNA. It has its own membrane.","The nucleus is like the cell's control room.","núcleo","নিউক্লিয়াস","细胞核"],
"dna":["DNA","The instructions for building and running a cell.","Every cell has DNA.","ADN","ডিএনএ","DNA"],
"prokaryote":["prokaryote","A cell with no nucleus. Bacteria are prokaryotes.","A bacterium is a prokaryote.","procariota","আদিকোষী","原核生物"],
"eukaryote":["eukaryote","A cell with a nucleus. Animal and plant cells are eukaryotes.","Your muscle cells are eukaryotes.","eucariota","প্রকৃতকোষী","真核生物"],
"organelle":["organelle","A small part inside a cell that does one job.","A mitochondrion is an organelle that makes energy.","orgánulo","অঙ্গাণু","细胞器"],
"cytoplasm":["cytoplasm","The jelly-like inside of a cell.","Many reactions happen in the cytoplasm.","citoplasma","সাইটোপ্লাজম","细胞质"],
"ribosome":["ribosome","A tiny part of the cell that makes proteins.","Ribosomes read instructions and build proteins.","ribosoma","রাইবোসোম","核糖体"],
"surface-area":["surface area","The size of the outside of something.","A bigger box has more surface area.","área de superficie","পৃষ্ঠতলের ক্ষেত্রফল","表面积"],
"volume":["volume","How much space something takes up.","A big cell has a large volume.","volumen","আয়তন","体积"],
"membrane":["membrane","A thin layer around a cell. It controls what goes in and out.","Oxygen passes through the cell membrane.","membrana","ঝিল্লি","膜"],
"selectively-permeable":["selectively permeable","Lets some things pass, but not others.","The membrane is selectively permeable, so not everything can enter.","selectivamente permeable","বৈষম্যভেদ্য","选择透过性"],
"phospholipid":["phospholipid","The main building block of the membrane. It has a head and two tails.","Phospholipids make two layers.","fosfolípido","ফসফোলিপিড","磷脂"],
"hydrophilic":["hydrophilic","Water-loving. It likes to touch water.","Salt and sugar are hydrophilic.","hidrofílico","জলাকর্ষী","亲水的"],
"hydrophobic":["hydrophobic","Water-fearing. It stays away from water.","Oil is hydrophobic, so it does not mix with water.","hidrofóbico","জলবিকর্ষী","疏水的"],
"bilayer":["bilayer","Two layers.","The membrane is a phospholipid bilayer.","bicapa","দ্বিস্তর","双层"],
"fluid-mosaic":["fluid mosaic model","The model of the membrane: many different parts (mosaic) that can move (fluid).","The fluid mosaic model describes the cell membrane.","modelo de mosaico fluido","ফ্লুইড মোজাইক মডেল","流动镶嵌模型"],
"protein":["protein","A large molecule that does many jobs in the cell.","Some proteins work as doors in the membrane.","proteína","প্রোটিন","蛋白质"],
"integral-protein":["integral protein","A protein that goes into or all the way through the membrane.","A channel is an integral protein.","proteína integral","ইন্টিগ্রাল প্রোটিন","整合蛋白"],
"peripheral-protein":["peripheral protein","A protein that sits on the surface of the membrane.","Peripheral proteins can help hold the cell's shape.","proteína periférica","পেরিফেরাল প্রোটিন","外周蛋白"],
"glycoprotein":["glycoprotein","A protein with a sugar chain on it. It works like a name tag.","Glycoproteins help cells recognize each other.","glucoproteína","গ্লাইকোপ্রোটিন","糖蛋白"],
"cholesterol":["cholesterol","A lipid that keeps animal cell membranes not too runny and not too stiff.","Cholesterol sits between phospholipids.","colesterol","কোলেস্টেরল","胆固醇"],
"passive-transport":["passive transport","Movement across the membrane that uses no energy from the cell.","Diffusion is passive transport.","transporte pasivo","নিষ্ক্রিয় পরিবহন","被动运输"],
"concentration":["concentration","How much of something is in one space.","Salty water has a high concentration of salt.","concentración","ঘনত্ব","浓度"],
"gradient":["concentration gradient","A difference in concentration, from high to low.","Oxygen moves down its concentration gradient.","gradiente de concentración","ঘনত্বের ঢাল","浓度梯度"],
"diffusion":["diffusion","When particles spread from high concentration to low concentration.","The smell of food spreads by diffusion.","difusión","ব্যাপন","扩散"],
"equilibrium":["equilibrium","When the concentration is the same everywhere.","At equilibrium, the amounts stay the same.","equilibrio","সাম্যাবস্থা","平衡"],
"facilitated-diffusion":["facilitated diffusion","Diffusion with help from a membrane protein. It uses no energy.","Glucose enters many cells by facilitated diffusion.","difusión facilitada","সহায়ক ব্যাপন","协助扩散"],
"channel-protein":["channel protein","A protein that makes a tunnel through the membrane.","Ions pass through channel proteins.","proteína de canal","চ্যানেল প্রোটিন","通道蛋白"],
"carrier-protein":["carrier protein","A protein that grabs a molecule, changes shape, and moves it across.","A carrier protein moves glucose.","proteína transportadora","বাহক প্রোটিন","载体蛋白"],
"osmosis":["osmosis","The diffusion of water across a selectively permeable membrane.","Water enters the root by osmosis.","ósmosis","অভিস্রবণ","渗透作用"],
"solute":["solute","Something dissolved in water, like salt or sugar.","Salt is the solute in salt water.","soluto","দ্রব","溶质"],
"aquaporin":["aquaporin","A channel protein just for water.","Kidney cells have many aquaporins.","acuaporina","অ্যাকোয়াপোরিন","水通道蛋白"],
"hypotonic":["hypotonic","The outside has less solute than the inside. Water moves in.","Pure water is hypotonic to a blood cell.","hipotónico","হাইপোটনিক","低渗"],
"isotonic":["isotonic","The outside and inside have the same solute concentration.","IV salt water is isotonic to blood.","isotónico","আইসোটনিক","等渗"],
"hypertonic":["hypertonic","The outside has more solute than the inside. Water moves out.","Sea water is hypertonic to your cells.","hipertónico","হাইপারটনিক","高渗"],
"active-transport":["active transport","Moving something from low to high concentration. It needs energy.","Pumps do active transport.","transporte activo","সক্রিয় পরিবহন","主动运输"],
"atp":["ATP","The cell's energy 'money'. Cells spend ATP to do work.","The pump uses one ATP each cycle.","ATP","এটিপি","ATP"],
"pump":["pump","A membrane protein that uses energy to move things up the gradient.","The sodium-potassium pump uses ATP.","bomba","পাম্প","泵"],
"ion":["ion","An atom or molecule with an electric charge, like Na⁺ or K⁺.","Sodium (Na⁺) is an ion.","ion","আয়ন","离子"],
"electrochemical-gradient":["electrochemical gradient","A difference in concentration plus a difference in electric charge.","Nerve cells use an electrochemical gradient to send signals.","gradiente electroquímico","তড়িৎ-রাসায়নিক ঢাল","电化学梯度"],
"secondary-active":["secondary active transport","Active transport that uses a gradient made by a pump, not ATP directly.","Glucose enters gut cells by secondary active transport.","transporte activo secundario","গৌণ সক্রিয় পরিবহন","继发性主动运输"],
"uniporter":["uniporter","A carrier that moves one kind of molecule.","A glucose uniporter moves only glucose.","uniportador","ইউনিপোর্টার","单向转运体"],
"symporter":["symporter","A carrier that moves two kinds of molecules in the same direction.","A symporter brings Na⁺ and glucose in together.","simportador","সিমপোর্টার","同向转运体"],
"antiporter":["antiporter","A carrier that moves two kinds of molecules in opposite directions.","The sodium-potassium pump is an antiporter.","antiportador","অ্যান্টিপোর্টার","反向转运体"],
"vesicle":["vesicle","A small bubble made of membrane. It carries things.","The vesicle carried insulin to the membrane.","vesícula","ভেসিকল","囊泡"],
"endocytosis":["endocytosis","When a cell takes something in by wrapping its membrane around it.","Cells take in big particles by endocytosis.","endocitosis","এন্ডোসাইটোসিস","胞吞作用"],
"phagocytosis":["phagocytosis","'Cell eating': taking in a large particle, like a bacterium.","White blood cells use phagocytosis.","fagocitosis","ফ্যাগোসাইটোসিস","吞噬作用"],
"pinocytosis":["pinocytosis","'Cell drinking': taking in small drops of fluid.","Pinocytosis brings in fluid from outside.","pinocitosis","পিনোসাইটোসিস","胞饮作用"],
"receptor":["receptor","A protein that catches one specific molecule.","LDL receptors catch cholesterol particles.","receptor","রিসেপ্টর","受体"],
"exocytosis":["exocytosis","When a vesicle joins the membrane and releases its contents outside.","Nerve cells release messages by exocytosis.","exocitosis","এক্সোসাইটোসিস","胞吐作用"]

const CHAPTERS=[
{id:"c1",num:1,emoji:"🔬",title:"Cells: The Basic Unit of Life",min:12,
 src:["Biology 2e, 4.1 Studying Cells and 4.2 Prokaryotic Cells","https://openstax.org/books/biology-2e/pages/4-1-studying-cells"],
 goals:["say the three ideas of cell theory","tell the difference between prokaryotic and eukaryotic cells","explain why most cells are small"],
 lang:"I can use the words nucleus, prokaryote, and eukaryote in a sentence.",
 sections:[
 {id:"s1",h:"What is a cell?",s:["A [[cell]] is the smallest unit of life. It is the smallest thing that is alive.","Some [[organism|organisms]] are only one cell. Bacteria are an example.","Other organisms have many cells. Your body has about 30 trillion cells.","Cells work in teams. Many cells make a tissue. Tissues make organs, like your heart."],
  m:["The levels go: cells → tissues → organs → organ systems → organism.","Different cells have different jobs. A nerve cell sends signals. A red blood cell carries oxygen."],
  an:"Cells are like bricks in a building. One brick is small, but many bricks make a house."},
 {id:"s2",h:"How do we see cells?",s:["Most cells are too small to see with your eyes. We use a [[microscope]].","A light microscope uses light and glass lenses. You can see living cells with it.","An electron microscope uses a beam of tiny particles called electrons. It shows much smaller details. But the cells are usually not alive when you look at them."],
  m:["In 1665, Robert Hooke looked at thin pieces of cork. He saw small boxes and called them 'cells'.","A few years later, Antonie van Leeuwenhoek made strong lenses. He was one of the first people to see living bacteria.","Scientists measure cells in micrometers (µm). One micrometer is one millionth of a meter."],
  chk:["You want to watch a living cell move. Which microscope is best?",["A light microscope","An electron microscope"],0,"Light microscopes can show living cells. Electron microscopes usually need cells that are not alive."]},
 {id:"s3",h:"Cell theory: three big ideas",s:["[[cell-theory|Cell theory]] has three ideas:","1. All living things are made of one or more cells.","2. The cell is the basic unit of life.","3. New cells come only from cells that already exist."],
  m:["Matthias Schleiden (1838) said plants are made of cells. Theodor Schwann (1839) said animals are made of cells.","In 1855, Rudolf Virchow wrote that all cells come from other cells.","Today these ideas together are called the unified cell theory."],
  tip:"Memory trick: Made of cells. Unit of life. Cells from cells."},
 {id:"s4",h:"Two kinds of cells",s:["All cells have four things: a cell [[membrane]], [[cytoplasm]], [[ribosome|ribosomes]], and [[dna|DNA]].","A [[prokaryote]] has no [[nucleus]]. Its DNA sits in one area of the cell. Bacteria and archaea are prokaryotes.","A [[eukaryote]] has a nucleus. It also has [[organelle|organelles]] with their own membranes. Animals, plants, fungi, and protists are eukaryotes."],
  m:["Prokaryotic cells are usually 0.1 to 5 µm wide. Eukaryotic cells are usually 10 to 100 µm wide.","The DNA area in a prokaryote is called the nucleoid. Many prokaryotes also have a cell wall, and some have a tail called a flagellum."],
  tip:"Eu-karyote means 'true nucleus'. Pro-karyote means 'before nucleus'.",vis:"celltypes",
  chk:["Which cell has a nucleus?",["A bacterium","A human skin cell"],1,"Human cells are eukaryotic, so they have a nucleus. Bacteria are prokaryotes and have no nucleus."]},
 {id:"s5",h:"Why are cells so small?",s:["Food and oxygen enter through the outside of the cell. Waste leaves through the outside too.","When a cell gets bigger, its inside ([[volume]]) grows faster than its outside ([[surface-area|surface area]]).","If a cell is too big, the outside cannot move enough food in and waste out. So most cells stay small."],
  m:["Example: a cube 1 cm wide has a surface area of 6 cm² and a volume of 1 cm³. That is 6 to 1.","A cube 2 cm wide has 24 cm² and 8 cm³. That is only 3 to 1. The bigger cube has less outside for each bit of inside."],
  an:"Think of a classroom with one door. With 10 students, everyone leaves fast. With 200 students, the door is too small."}
 ],
 say:["Cell theory says that all living things ___. The cell is ___. New cells come from ___.","Cell theory says that all living things are made of one or more cells. The cell is the basic unit of life. New cells come from cells that already exist."],
 quiz:[
 ["c1q1","s3","mc","Which idea is NOT part of cell theory?",["All living things are made of cells.","The cell is the basic unit of life.","New cells come from cells that already exist.","All cells have a nucleus."],3,"Bacteria are cells, but they have no nucleus. So 'all cells have a nucleus' is not part of cell theory.","cell-theory"],
 ["c1q2","s4","mc","What is the main difference between prokaryotic and eukaryotic cells?",["Only eukaryotic cells have a nucleus.","Only prokaryotic cells have DNA.","Only eukaryotic cells have a membrane.","Only prokaryotic cells are alive."],0,"Both kinds have DNA and a membrane, and both are alive. The nucleus is the difference.","nucleus"],
 ["c1q3","s4","tf","True or false: Bacteria are prokaryotes.",null,true,"Bacteria have no nucleus, so they are prokaryotes.","prokaryote"],
 ["c1q4","s2","mc","Which tool shows the smallest details inside a cell?",["Your eyes","A magnifying glass","A light microscope","An electron microscope"],3,"Electron microscopes use electrons, not light, so they show much smaller details.","microscope"],
 ["c1q5","s5","mc","Why do most cells stay small?",["Big cells cannot move enough food in and waste out through their surface.","Big cells have no DNA.","Big cells cannot be seen.","Cells stop growing when they get cold."],0,"As a cell grows, its volume grows faster than its surface area. The surface becomes too small for the cell's needs.","surface-area"],
 ["c1q6","s4","mc","Which part do ALL cells have?",["A nucleus","A cell membrane","A cell wall","Chloroplasts"],1,"All cells have a membrane, cytoplasm, ribosomes, and DNA. Animal cells have no cell wall, and bacteria have no nucleus.","membrane"],
 ["c1q7","s3","mc","Where do new cells come from?",["From cells that already exist","From water and sugar","From the air","From dead material"],0,"Rudolf Virchow (1855): all cells come from other cells.","cell-theory"],
 ["c1q8","s4","mc","A plant leaf cell has a nucleus. What kind of cell is it?",["Prokaryotic","Eukaryotic","Bacterial","Neither"],1,"A cell with a nucleus is eukaryotic. Plants are eukaryotes.","eukaryote"],
 ["c1q9","s1","tf","True or false: Some living things are made of only one cell.",null,true,"Bacteria and many other organisms are made of just one cell.","organism"]
 ]},
{id:"c2",num:2,emoji:"🫧",title:"The Cell Membrane",min:14,
 src:["Biology 2e, 5.1 Components and Structure","https://openstax.org/books/biology-2e/pages/5-1-components-and-structure"],
 goals:["describe the phospholipid bilayer","explain what 'fluid mosaic' means","name the jobs of proteins, sugars, and cholesterol in the membrane"],
 lang:"I can explain the words hydrophilic and hydrophobic with an example.",
 sections:[
 {id:"s1",h:"The membrane's job",s:["Every cell has a thin [[membrane|cell membrane]] around it. It is also called the plasma membrane.","It keeps the inside of the cell separate from the outside.","It decides what can go in and out. We say it is [[selectively-permeable|selectively permeable]]."],
  m:["The membrane is very thin: about 5 to 10 nanometers. That is thousands of times thinner than a sheet of paper."],
  an:"The membrane is like a security guard at a building. Some people walk in. Others need a key card. Some cannot enter at all."},
 {id:"s2",h:"Phospholipids: heads and tails",s:["The membrane is made mostly of [[phospholipid|phospholipids]].","Each phospholipid has a head and two tails.","The head is [[hydrophilic]]. It likes water.","The tails are [[hydrophobic]]. They stay away from water.","In water, phospholipids make two layers, a [[bilayer]]. The heads face the water on the outside and the inside. The tails hide in the middle."],
  m:["The head has a phosphate group, which has an electric charge. The tails are fatty acid chains.","A molecule with a water-loving part and a water-fearing part is called amphipathic."],
  vis:"bilayer",
  chk:["Where are the phospholipid tails?",["Facing the water outside the cell","In the middle of the membrane, away from water"],1,"The tails are hydrophobic, so they hide in the middle, away from water."]},
 {id:"s3",h:"The fluid mosaic model",s:["Scientists describe the membrane with the [[fluid-mosaic|fluid mosaic model]].","Mosaic means it is made of many different pieces: phospholipids, proteins, cholesterol, and sugars.","Fluid means the pieces are not stuck. They can move side to side, like boats on a lake."],
  m:["S. J. Singer and Garth Nicolson proposed this model in 1972. It is still the main model today.","An older idea from 1935 said the membrane was like a sandwich, with proteins as the bread. Later studies showed that many proteins go through the membrane, so the sandwich idea was wrong."]},
 {id:"s4",h:"Membrane proteins",s:["[[protein|Proteins]] do most of the membrane's jobs.","An [[integral-protein|integral protein]] goes into or all the way through the membrane. Many are doors that let things in and out.","A [[peripheral-protein|peripheral protein]] sits on the surface. It can pass on signals or help hold the cell's shape."],
  m:["The parts of integral proteins that touch the tails are hydrophobic. The parts that touch water are hydrophilic.","Membrane proteins can be channels, carriers, pumps, receptors (they catch signals), and enzymes."]},
 {id:"s5",h:"Sugar name tags",s:["Some proteins and lipids have short sugar chains on the outside of the cell.","A protein with sugars is a [[glycoprotein]]. A lipid with sugars is a glycolipid.","These sugars work like name tags. They help cells recognize each other. Your immune system uses them to tell your own cells from germs."],
  m:["Blood types A, B, AB, and O come from different sugar chains on red blood cells.","The sugary layer on the outside of many cells is called the glycocalyx."]},
 {id:"s6",h:"Cholesterol and fluidity",s:["The membrane must not be too runny or too stiff.","In animal cells, [[cholesterol]] sits between the phospholipids.","When it is warm, cholesterol stops the membrane from getting too runny. When it is cold, it stops the membrane from getting too stiff."],
  m:["Tails with double bonds (unsaturated) have bends. Bent tails cannot pack tightly, so the membrane is more fluid.","Straight tails (saturated) pack tightly, so the membrane is less fluid. Think of butter (saturated, solid) and olive oil (unsaturated, liquid)."],
  chk:["What does cholesterol do in the membrane?",["It keeps the membrane from becoming too runny or too stiff","It carries oxygen","It makes a nucleus"],0,"Cholesterol keeps fluidity steady when the temperature changes."]}
 ],
 say:["The membrane is made of ___. The heads are ___ and the tails are ___. It is called 'fluid mosaic' because ___.","The membrane is made of a phospholipid bilayer with proteins, cholesterol, and sugars. The heads are hydrophilic and the tails are hydrophobic. It is called 'fluid mosaic' because it has many different pieces that can move side to side."],
 quiz:[
 ["c2q1","s2","mc","The head of a phospholipid is…",["hydrophilic (water-loving)","hydrophobic (water-fearing)","made of sugar","a protein"],0,"The head has a charged phosphate group, so it likes water.","hydrophilic"],
 ["c2q2","s2","mc","In the bilayer, where are the tails?",["In the middle, away from water","On the outside, touching water","Inside the nucleus","Outside the cell"],0,"The tails are hydrophobic, so they face each other in the middle.","hydrophobic"],
 ["c2q3","s3","mc","In 'fluid mosaic', what does 'fluid' mean?",["The parts can move side to side","The membrane is made of water","The membrane is a liquid drink","The membrane has holes everywhere"],0,"Fluid means the pieces are not stuck in one place. They can move around in the layer.","fluid-mosaic"],
 ["c2q4","s3","mc","In 'fluid mosaic', what does 'mosaic' mean?",["It is made of many different pieces","It is all one color","It never changes","It is only made of protein"],0,"A mosaic is a picture made of many small pieces. The membrane has many kinds of molecules.","fluid-mosaic"],
 ["c2q5","s4","mc","A protein that goes all the way through the membrane is…",["an integral protein","a peripheral protein","a carbohydrate","cholesterol"],0,"Integral proteins go into or through the membrane. Peripheral proteins sit on the surface.","integral-protein"],
 ["c2q6","s5","mc","What is one job of sugar chains on the outside of the membrane?",["They help cells recognize each other","They make ATP","They store DNA","They make the membrane waterproof"],0,"Sugar chains work like name tags for cell recognition.","glycoprotein"],
 ["c2q7","s6","mc","What does cholesterol do in animal cell membranes?",["Keeps fluidity steady when temperature changes","Lets all molecules in","Makes proteins","Breaks the membrane"],0,"Cholesterol stops the membrane from being too runny when warm or too stiff when cold.","cholesterol"],
 ["c2q8","s1","mc","'Selectively permeable' means the membrane…",["lets some things through but not others","lets everything through","lets nothing through","is only found in plants"],0,"Selective means it chooses. Permeable means things can pass.","selectively-permeable"],
 ["c2q9","s6","tf","True or false: Bent (unsaturated) tails make the membrane more fluid.",null,true,"Bent tails cannot pack tightly, so the membrane is more fluid.","phospholipid"]
 ]},
{id:"c3",num:3,emoji:"💧",title:"Passive Transport: Diffusion and Osmosis",min:15,
 src:["Biology 2e, 5.2 Passive Transport","https://openstax.org/books/biology-2e/pages/5-2-passive-transport"],
 goals:["explain diffusion using the words high, low, and gradient","tell simple diffusion from facilitated diffusion","predict if a cell will swell or shrink in a solution"],
 lang:"I can describe what happens to a cell using hypotonic, isotonic, and hypertonic.",
 sections:[
 {id:"s1",h:"What is passive transport?",s:["[[passive-transport|Passive transport]] means things cross the membrane without using the cell's energy.","Things move from where there is a lot (high [[concentration]]) to where there is a little (low concentration).","This difference from high to low is a [[gradient|concentration gradient]]. Moving from high to low is called moving 'down' the gradient."],
  an:"It is like a ball rolling down a hill. It does not need a push."},
 {id:"s2",h:"Simple diffusion",s:["[[diffusion|Diffusion]] is when particles spread from high to low concentration.","Small molecules with no charge, like oxygen (O₂) and carbon dioxide (CO₂), pass right through the bilayer.","Diffusion keeps going until the concentration is the same everywhere. This is [[equilibrium]]. The particles still move, but the amounts on each side stay the same."],
  m:["Diffusion is faster when the gradient is bigger, the temperature is higher, the molecules are smaller, and the distance is shorter."],
  an:"Spray perfume in one corner of a room. Soon you can smell it everywhere.",vis:"diffusion"},
 {id:"s3",h:"Facilitated diffusion: help from proteins",s:["Some things cannot pass through the tails. Ions (like Na⁺) and big molecules (like glucose) need help.","In [[facilitated-diffusion|facilitated diffusion]], membrane proteins help them cross.","A [[channel-protein|channel protein]] is like a tunnel. A [[carrier-protein|carrier protein]] grabs the molecule, changes shape, and lets it go on the other side.","It still goes from high to low, so the cell uses no energy."],
  m:["Channels are often specific. A potassium channel lets K⁺ pass but not Na⁺.","Carrier proteins can get 'full'. When all carriers are busy, adding more glucose does not make transport faster."],
  chk:["Glucose crosses with a carrier protein, from high to low concentration. Does the cell use energy?",["No. This is facilitated diffusion, which is passive.","Yes. This is active transport."],0,"It moves from high to low, so no energy is needed. The protein only gives it a path."]},
 {id:"s4",h:"Osmosis: water moves",s:["[[osmosis|Osmosis]] is the diffusion of water across a selectively permeable membrane.","Water moves toward the side with more [[solute]] (like salt or sugar). That side has less free water.","Water often moves through special channels called [[aquaporin|aquaporins]]."],
  m:["Peter Agre discovered aquaporins. He shared the 2003 Nobel Prize in Chemistry for this work."],
  tip:"Simple rule: water follows salt."},
 {id:"s5",h:"Tonicity: will the cell swell or shrink?",s:["Tonicity compares the solution outside the cell with the inside.","[[hypotonic|Hypotonic]]: less solute outside. Water goes in. An animal cell swells and may burst.","[[isotonic|Isotonic]]: the same solute concentration. Water goes in and out equally, so the size does not change.","[[hypertonic|Hypertonic]]: more solute outside. Water goes out. The cell shrinks."],
  m:["Plant cells have a strong cell wall. In hypotonic water they become firm (turgid), which is healthy for plants.","In hypertonic water, the plant cell membrane pulls away from the wall (plasmolysis), and the plant wilts.","Hospital IV drips often use 0.9% salt water because it is isotonic with blood cells."],
  tip:"Hypo = under (less solute outside). Hyper = over (more solute outside). Iso = equal.",vis:"tonicity"}
 ],
 say:["In diffusion, particles move from ___ to ___. This does not need ___. In osmosis, ___ moves toward the side with more ___.","In diffusion, particles move from high concentration to low concentration. This does not need energy. In osmosis, water moves toward the side with more solute."],
 quiz:[
 ["c3q1","s1","mc","Passive transport moves particles…",["from high to low concentration, with no cell energy","from low to high, using ATP","only out of the cell","only into the nucleus"],0,"Passive means no energy. Particles go down the gradient, from high to low.","passive-transport"],
 ["c3q2","s2","mc","Which molecule can diffuse straight through the bilayer?",["Oxygen (O₂)","A sodium ion (Na⁺)","Glucose","A large protein"],0,"Small molecules with no charge pass through the tails. Ions and big molecules need proteins.","diffusion"],
 ["c3q3","s3","mc","In facilitated diffusion, what helps molecules cross?",["Channel or carrier proteins","ATP","Cholesterol only","The nucleus"],0,"Proteins give the molecule a path. No ATP is used.","facilitated-diffusion"],
 ["c3q4","s4","mc","Osmosis is the movement of…",["water across a membrane","salt into the nucleus","proteins out of the cell","energy into the cell"],0,"Osmosis is the diffusion of water.","osmosis"],
 ["c3q5","s4","mc","In osmosis, water moves toward the side with…",["more solute","less solute","more oxygen","more light"],0,"Water follows salt. The side with more solute has less free water.","solute"],
 ["c3q6","s5","mc","A red blood cell is put in pure water (hypotonic). What happens?",["Water goes in, the cell swells, and it may burst","Water goes out and the cell shrinks","Nothing happens","The cell makes a cell wall"],0,"Pure water has less solute than the cell, so water moves in.","hypotonic"],
 ["c3q7","s5","mc","A cell shrinks in a salty solution. The solution is…",["hypertonic","hypotonic","isotonic","neutral"],0,"More solute outside pulls water out, so the cell shrinks.","hypertonic"],
 ["c3q8","s2","tf","True or false: At equilibrium, molecules stop moving completely.",null,false,"They still move, but the same number goes each way. So the amounts stay the same.","equilibrium"],
 ["c3q9","s2","mc","Which change makes diffusion faster?",["A higher temperature","A smaller gradient","Bigger molecules","A thicker membrane"],0,"Warmer molecules move faster, so they spread faster.","diffusion"]
 ]},
{id:"c4",num:4,emoji:"⚡",title:"Active Transport and Pumps",min:14,
 src:["Biology 2e, 5.3 Active Transport","https://openstax.org/books/biology-2e/pages/5-3-active-transport"],
 goals:["explain why active transport needs energy","describe the sodium-potassium pump","tell primary from secondary active transport"],
 lang:"I can compare passive and active transport using the words 'down', 'up', and 'energy'.",
 sections:[
 {id:"s1",h:"What is active transport?",s:["[[active-transport|Active transport]] moves things from low concentration to high concentration. This is 'up' the gradient.","Going up the gradient needs energy. Cells usually use [[atp|ATP]].","Special proteins called [[pump|pumps]] do this work."],
  an:"Passive transport is like riding a bike downhill. Active transport is like riding uphill. You must pedal (use energy)."},
 {id:"s2",h:"Why cells need it",s:["Cells need the inside to be different from the outside.","For example, cells keep a lot of potassium [[ion|ions]] (K⁺) inside and a lot of sodium ions (Na⁺) outside.","Diffusion always tries to make both sides equal. So pumps must work all the time to keep the difference."],
  m:["Active transport also lets cells take in nutrients even when there is already more inside than outside."]},
 {id:"s3",h:"The sodium-potassium pump",s:["This is one of the most important pumps in your body.","For each ATP it uses, it moves 3 sodium ions (Na⁺) out and 2 potassium ions (K⁺) in.","More positive charge goes out than comes in. So the inside of the cell becomes more negative than the outside.","Nerve and muscle cells need this to send signals."],
  m:["The pump changes shape when ATP gives it a phosphate group. This shape change opens it to the outside.","A difference in concentration plus a difference in charge is called an [[electrochemical-gradient|electrochemical gradient]].","Jens Skou discovered this pump. He shared the 1997 Nobel Prize in Chemistry.","Your brain cells spend a large part of their energy running this pump."],
  vis:"pump",
  chk:["The sodium-potassium pump moves…",["3 Na⁺ out and 2 K⁺ in","2 Na⁺ out and 3 K⁺ in","3 K⁺ out and 2 Na⁺ in"],0,"Remember '3 out, 2 in': 3 sodium out, 2 potassium in."]},
 {id:"s4",h:"Primary and secondary active transport",s:["Primary active transport uses ATP directly. The sodium-potassium pump is primary.","[[secondary-active|Secondary active transport]] does not use ATP directly. It uses a gradient that a pump already made.","Example: Na⁺ 'wants' to flow back into the cell. A protein lets Na⁺ in and brings glucose in with it, even if glucose must go up its gradient."],
  m:["Cells in your small intestine and kidneys use this sodium-glucose cotransport to take in glucose."],
  an:"A pump uses power to fill a water tower. Later, water flowing down from the tower can turn a wheel for free."},
 {id:"s5",h:"Three kinds of carriers",s:["A [[uniporter]] carries one kind of molecule.","A [[symporter]] carries two kinds in the same direction.","An [[antiporter]] carries two kinds in opposite directions. The sodium-potassium pump is an antiporter."],
  tip:"Uni = one. Sym = same. Anti = against (opposite)."}
 ],
 say:["Active transport moves things from ___ to ___. It needs ___. The sodium-potassium pump moves ___ out and ___ in.","Active transport moves things from low concentration to high concentration. It needs energy, usually ATP. The sodium-potassium pump moves 3 sodium ions out and 2 potassium ions in."],
 quiz:[
 ["c4q1","s1","mc","Active transport moves substances…",["from low to high concentration, using energy","from high to low, with no energy","only water","only gases"],0,"Active transport goes up the gradient, so it needs energy.","active-transport"],
 ["c4q2","s1","mc","What energy do cells usually use for active transport?",["ATP","Sunlight directly","Heat","Cholesterol"],0,"ATP is the cell's energy 'money'.","atp"],
 ["c4q3","s3","mc","For each ATP, the sodium-potassium pump moves…",["3 Na⁺ out and 2 K⁺ in","3 K⁺ out and 2 Na⁺ in","1 Na⁺ out and 1 K⁺ in","2 Na⁺ in and 3 K⁺ out"],0,"3 sodium out, 2 potassium in.","pump"],
 ["c4q4","s3","mc","After the pump works, the inside of the cell is…",["more negative than the outside","more positive than the outside","the same as the outside","full of sodium"],0,"3 positive ions go out but only 2 come in, so the inside becomes more negative.","electrochemical-gradient"],
 ["c4q5","s5","mc","The sodium-potassium pump moves two ions in opposite directions. It is…",["an antiporter","a symporter","a uniporter","a channel"],0,"Anti = opposite.","antiporter"],
 ["c4q6","s4","mc","Secondary active transport gets its energy from…",["a gradient made by another pump","sunlight","cholesterol","the nucleus"],0,"It uses the Na⁺ gradient that the sodium-potassium pump made with ATP.","secondary-active"],
 ["c4q7","s2","mc","Why must pumps work all the time?",["Diffusion keeps trying to make both sides equal","ATP is not needed","Cells have no membrane","Ions never move"],0,"Ions slowly leak back down their gradients, so pumps keep pushing them back.","pump"],
 ["c4q8","s5","tf","True or false: A symporter moves two substances in the same direction.",null,true,"Sym = same direction.","symporter"],
 ["c4q9","s1","tf","True or false: Osmosis is a kind of active transport.",null,false,"Osmosis is passive. Water moves down its own gradient with no ATP.","osmosis"]
 ]},
{id:"c5",num:5,emoji:"🫙",title:"Bulk Transport: Big Things In and Out",min:10,
 src:["Biology 2e, 5.4 Bulk Transport","https://openstax.org/books/biology-2e/pages/5-4-bulk-transport"],
 goals:["explain endocytosis and exocytosis","tell phagocytosis from pinocytosis","sort every transport type into passive or active"],
 lang:"I can describe endocytosis and exocytosis using the words 'in', 'out', and 'vesicle'.",
 sections:[
 {id:"s1",h:"When things are too big",s:["Some things are too big for channels and carriers. Examples are whole bacteria and large proteins.","The cell moves them inside small bubbles of membrane called [[vesicle|vesicles]].","This is called bulk transport. It needs energy (ATP)."]},
 {id:"s2",h:"Endocytosis: bringing things in",s:["In [[endocytosis]], the membrane folds around something and pinches off into a vesicle inside the cell.","[[phagocytosis|Phagocytosis]] means 'cell eating'. White blood cells eat bacteria this way.","[[pinocytosis|Pinocytosis]] means 'cell drinking'. The cell takes in small drops of fluid."],
  vis:"bulk",
  chk:["A white blood cell swallows a bacterium. This is…",["phagocytosis","exocytosis","osmosis"],0,"Taking in a large particle is 'cell eating', or phagocytosis."]},
 {id:"s3",h:"Receptor-mediated endocytosis",s:["Sometimes the cell wants only one kind of molecule.","[[receptor|Receptors]] on the membrane catch that molecule. Then that part of the membrane folds in.","Example: cells take in LDL cholesterol from the blood this way."],
  m:["In a genetic condition called familial hypercholesterolemia, LDL receptors do not work well. LDL stays in the blood, so blood cholesterol is high.","The folded-in areas are often coated with a protein called clathrin."]},
 {id:"s4",h:"Exocytosis: sending things out",s:["[[exocytosis|Exocytosis]] is the opposite of endocytosis.","A vesicle moves to the membrane, joins with it, and releases what is inside to the outside.","Examples: pancreas cells release insulin, and nerve cells release chemical messages."],
  m:["Exocytosis also adds new membrane to the cell surface, because the vesicle membrane becomes part of the cell membrane.","James Rothman, Randy Schekman, and Thomas Südhof shared the 2013 Nobel Prize in Physiology or Medicine for explaining how cells control vesicle traffic."]},
 {id:"s5",h:"Putting it all together",s:["Passive transport needs no energy: simple diffusion, facilitated diffusion, and osmosis.","Active transport needs energy: pumps (primary), cotransport (secondary), endocytosis, and exocytosis."],vis:"summary"}
 ],
 say:["In endocytosis, the cell ___. In exocytosis, the cell ___. Both use ___ and need ___.","In endocytosis, the cell takes things in by folding its membrane around them. In exocytosis, the cell sends things out when a vesicle joins the membrane. Both use vesicles and need energy."],
 quiz:[
