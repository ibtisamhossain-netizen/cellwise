});

CHAPTERS.push(
{id:"c12",num:12,unit:3,teas:"S.1.1",emoji:"🧍",title:"Body Map: Directions, Cavities, and Tissues",min:16,
 src:["Anatomy and Physiology 2e, Chapter 1 An Introduction to the Human Body and Chapter 4 The Tissue Level of Organization","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["use directional terms and body planes correctly","name the body cavities and what they hold","explain homeostasis and feedback loops","name the four tissue types"],
 lang:"I can describe where a body part is using words like superior, medial, and distal.",
 sections:[
 {id:"s1",h:"Levels and homeostasis",s:["The body is built in levels: chemicals → cells → [[tissue|tissues]] → organs → organ systems → the whole organism.","[[homeostasis|Homeostasis]] means keeping the inside of the body stable. Examples: body temperature around 37 °C (98.6 °F), blood sugar, and blood pH (about 7.35 to 7.45).","Most control uses [[negative-feedback|negative feedback]]. The body senses a change and reverses it. Example: when you are hot, you sweat and cool down.","[[positive-feedback|Positive feedback]] makes a change bigger until something ends it. Examples: labor contractions and blood clotting."],
  an:"Negative feedback is like a thermostat. When the room gets too hot, it turns on the air conditioner. When the room cools, it turns it off.",
  flow:["A change happens (body gets too hot)","Sensors notice the change (nerve endings in skin)","The control center decides (hypothalamus in the brain)","Effectors act (sweat glands make sweat)","The body returns to normal (temperature goes down)"]},
 {id:"s2",h:"Directions on the body",s:["We always describe the body in [[anatomical-position|anatomical position]]: standing, facing forward, palms forward.","[[superior|Superior]] = above, toward the head. Inferior = below.","[[anterior|Anterior]] (ventral) = front. Posterior (dorsal) = back.","[[medial|Medial]] = toward the midline. Lateral = toward the side.","[[proximal|Proximal]] = closer to the trunk (for arms and legs). Distal = farther away.","Superficial = near the surface. Deep = farther inside."],
  nl:"'Right' and 'left' always mean the patient's right and left, not yours.",
  tip:"Proximal sounds like 'approximate', close by. Distal sounds like 'distant'.",
  chk:["Which sentence is correct?",["The wrist is distal to the elbow","The wrist is proximal to the elbow","The wrist is superior to the elbow (in anatomical position)"],0,"The wrist is farther from the trunk than the elbow, so it is distal."]},
 {id:"s3",h:"Body planes",s:["A [[plane|body plane]] is an imaginary flat cut.","The sagittal plane divides the body into left and right parts. The midsagittal plane makes equal halves.","The frontal (coronal) plane divides the body into front and back parts.","The transverse (horizontal) plane divides the body into top and bottom parts."],
  m:["CT and MRI images are often shown as transverse 'slices' of the body."]},
 {id:"s4",h:"Body cavities and regions",s:["The dorsal cavity is at the back. It holds the brain (cranial cavity) and the spinal cord (vertebral cavity).","The ventral cavity is at the front. The thoracic cavity holds the heart and lungs. The abdominopelvic cavity holds the stomach, intestines, liver, bladder, and reproductive organs.","The diaphragm, a dome-shaped muscle, separates the thoracic cavity from the abdominal cavity."],
  m:["Nurses often divide the abdomen into four quadrants: right upper (liver, gallbladder), left upper (stomach, spleen), right lower (appendix), and left lower (part of the colon)."],
  nl:"Pain in the right lower quadrant can be a sign of appendicitis."},
 {id:"s5",h:"The four tissue types",s:["Epithelial tissue covers surfaces and lines organs, like the skin and the inside of the gut.","Connective tissue supports and connects. Bone, cartilage, fat, tendons, and blood are all connective tissue.","Muscle tissue makes movement. There are three kinds: skeletal, cardiac, and smooth.","Nervous tissue sends signals. It has neurons and support cells (glia)."],
  tbl:[["Tissue","Main job","Examples"],[["Epithelial","Covers, lines, protects, absorbs","Skin surface, lining of stomach and lungs"],["Connective","Supports, connects, stores, transports","Bone, blood, fat, cartilage, tendons"],["Muscle","Moves","Skeletal muscle, heart, wall of stomach"],["Nervous","Sends signals","Brain, spinal cord, nerves"]]]}
 ],
 say:["Homeostasis means ___. In negative feedback, the body ___. One example is ___.","Homeostasis means keeping the inside of the body stable. In negative feedback, the body reverses a change. One example is sweating when you are too hot."],
 quiz:[
 ["c12q1","s2","mc","The knee is ___ to the ankle.",["proximal","distal","lateral","inferior"],0,"The knee is closer to the trunk than the ankle.","proximal"],
 ["c12q2","s2","mc","The nose is ___ to the eyes.",["medial","lateral","posterior","distal"],0,"The nose is closer to the midline than the eyes.","medial"],
 ["c12q3","s3","mc","Which plane divides the body into top and bottom parts?",["Transverse","Sagittal","Frontal","Midsagittal"],0,"Transverse (horizontal) = top and bottom.","plane"],
 ["c12q4","s4","mc","Which cavity holds the heart and lungs?",["Thoracic","Cranial","Vertebral","Pelvic"],0,"The thoracic cavity is in the chest.","anterior"],
 ["c12q5","s1","mc","Which is an example of negative feedback?",["Shivering when the body is cold","Labor contractions getting stronger","Blood clotting","A fever rising forever"],0,"Shivering makes heat and reverses the drop in temperature.","negative-feedback"],
 ["c12q6","s1","mc","Which is an example of positive feedback?",["Labor contractions during childbirth","Sweating when hot","Insulin lowering blood sugar","Breathing faster when CO₂ is high"],0,"In childbirth, contractions cause more oxytocin, which causes stronger contractions.","positive-feedback"],
 ["c12q7","s5","mc","Blood is which type of tissue?",["Connective","Epithelial","Muscle","Nervous"],0,"Blood is a fluid connective tissue.","tissue"],
 ["c12q8","s4","mc","Which muscle separates the chest cavity from the abdominal cavity?",["Diaphragm","Biceps","Heart","Esophagus"],0,"The diaphragm is a dome-shaped muscle under the lungs.","anterior"],
 ["c12q9","s2","tf","True or false: In anatomical position, the palms face forward.",null,true,"Anatomical position: standing, facing forward, arms down, palms forward.","anatomical-position"]
 ]},

{id:"c13",num:13,unit:3,teas:"S.1.8",emoji:"🖐️",title:"Skin, Hair, and Nails (Integumentary System)",min:13,
 src:["Anatomy and Physiology 2e, Chapter 5 The Integumentary System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["name the layers of the skin","list the jobs of the skin","describe how skin helps control body temperature","compare burn depths"],
 lang:"I can describe the layers of the skin from the top down.",
 sections:[
 {id:"s1",h:"Jobs of the skin",s:["The skin is the body's largest organ.","It protects the body from germs, injury, water loss, and UV light.","It helps control body temperature.","It feels touch, pain, heat, and cold.","It makes vitamin D when sunlight hits it."]},
 {id:"s2",h:"Layers of the skin",s:["The [[epidermis]] is the top layer. It has no blood vessels. Its bottom cells divide all the time and push older cells up. The top cells are dead and full of [[keratin]].","Melanocytes in the epidermis make [[melanin]]. Melanin gives skin its color and protects DNA from UV light.","The [[dermis]] is under the epidermis. It is thick and strong because of collagen and elastic fibers. It has blood vessels, nerves, hair roots, and glands.","Under the skin is the hypodermis (subcutaneous layer). It is mostly fat. It stores energy, keeps you warm, and cushions the body."],
  m:["The layers of the epidermis, from deep to surface: stratum basale, stratum spinosum, stratum granulosum, stratum lucidum (only in thick skin, like the palms and soles), and stratum corneum.","Subcutaneous ('subQ') injections, like insulin, go into the hypodermis."],
  flow:["Epidermis: top layer, no blood vessels","Dermis: blood vessels, nerves, glands, hair roots","Hypodermis: fat and loose connective tissue","Muscle"]},
 {id:"s3",h:"Hair, nails, and glands",s:["Hair and nails are made of keratin.","Sweat glands make sweat to cool the body.","Sebaceous glands make oil (sebum). Oil keeps skin and hair soft and helps kill some bacteria."],
  m:["Eccrine sweat glands are all over the body and help with cooling. Apocrine sweat glands are in the armpits and groin and become active at puberty.","A tiny muscle (arrector pili) pulls the hair up when you are cold or scared. This makes goosebumps."]},
 {id:"s4",h:"Controlling temperature",s:["When you are hot, blood vessels in the dermis get wider (vasodilation). More heat leaves through the skin. You also sweat, and the sweat evaporates and cools you.","When you are cold, blood vessels get narrower (vasoconstriction). This keeps heat inside the body."],
  chk:["You are hot. What happens to the blood vessels in your skin?",["They get wider to release heat","They get narrower to keep heat","They stop carrying blood"],0,"Vasodilation sends more blood to the skin, so more heat leaves."]},
 {id:"s5",h:"Burns and healing",s:["Superficial (first-degree) burns affect only the epidermis. The skin is red and painful, like a sunburn.","Partial-thickness (second-degree) burns go into the dermis. There are blisters and strong pain.","Full-thickness (third-degree) burns destroy the epidermis and the dermis. The area may not hurt because the nerve endings are destroyed."],
  m:["The 'rule of nines' estimates how much skin is burned in adults. The head and each arm are about 9% each. The front of the trunk, the back of the trunk, and each leg are about 18% each."],
  nl:"Pressure injuries (bedsores) form when skin is pressed for a long time, often over bones like the hips and heels. Nurses turn patients who cannot move regularly to protect their skin."}
 ],
 say:["The skin has ___ layers. The top layer is the ___. When you are hot, the skin ___.","The skin has two main layers, with fat under them. The top layer is the epidermis. When you are hot, the skin sweats and its blood vessels get wider."],
 quiz:[
 ["c13q1","s2","mc","Which skin layer has no blood vessels?",["Epidermis","Dermis","Hypodermis","Muscle"],0,"The epidermis gets nutrients from the dermis below it.","epidermis"],
 ["c13q2","s2","mc","Which pigment protects the skin from UV light?",["Melanin","Keratin","Hemoglobin","Collagen"],0,"Melanin absorbs UV light.","melanin"],
 ["c13q3","s1","mc","Which vitamin does the skin make with sunlight?",["Vitamin D","Vitamin C","Vitamin K","Vitamin A"],0,"UV light helps the skin make vitamin D.","epidermis"],
 ["c13q4","s3","mc","Which glands make oil (sebum)?",["Sebaceous glands","Sweat glands","Salivary glands","Adrenal glands"],0,"Sebaceous glands make oil for skin and hair.","gland"],
 ["c13q5","s4","mc","How does the skin keep heat in when you are cold?",["Blood vessels get narrower","You sweat more","Blood vessels get wider","The epidermis gets thinner"],0,"Vasoconstriction keeps warm blood away from the surface.","dermis"],
 ["c13q6","s5","mc","A burn has blisters and goes into the dermis. What kind is it?",["Partial-thickness (second-degree)","Superficial (first-degree)","Full-thickness (third-degree)","Not a burn"],0,"Blisters are typical of partial-thickness burns.","dermis"],
 ["c13q7","s5","mc","Why might a full-thickness burn not hurt?",["The nerve endings are destroyed","It is not deep","The skin makes more melanin","Sweat glands stop pain"],0,"Full-thickness burns destroy the nerves in the dermis.","dermis"],
 ["c13q8","s2","mc","Where do subcutaneous (subQ) injections go?",["Into the fatty layer under the skin","Into the epidermis","Into a bone","Into a vein"],0,"Subcutaneous means under the skin, in the hypodermis.","dermis"],
 ["c13q9","s3","tf","True or false: Hair and nails are made of keratin.",null,true,"Keratin is a tough protein in skin, hair, and nails.","keratin"]
 ]},

{id:"c14",num:14,unit:3,teas:"S.1.12",emoji:"🦴",title:"Bones and Joints (Skeletal System)",min:15,
 src:["Anatomy and Physiology 2e, Chapters 6–9 (Bone Tissue, the Skeleton, and Joints)","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["list the jobs of the skeleton","compare the axial and appendicular skeleton","describe bone cells and bone remodeling","name the types of joints"],
 lang:"I can explain the difference between a ligament and a tendon.",
 sections:[
 {id:"s1",h:"Jobs of the skeleton",s:["An adult has 206 bones.","Bones support the body and protect organs. The skull protects the brain. The ribs protect the heart and lungs.","Bones work with muscles to move the body.","Bones store minerals, mostly calcium and phosphorus.","Red [[bone-marrow|bone marrow]] makes blood cells. Yellow marrow stores fat."],
  m:["Making blood cells is called hematopoiesis."]},
 {id:"s2",h:"Two parts of the skeleton",s:["The axial skeleton is the center of the body: the skull, the spine (vertebral column), the ribs, and the sternum. It has 80 bones.","The appendicular skeleton is the limbs plus the shoulder and hip bones that hold them. It has 126 bones."],
  m:["The spine has 7 cervical (neck), 12 thoracic (chest), and 5 lumbar (lower back) vertebrae, plus the sacrum and coccyx.","The femur (thigh bone) is the longest and strongest bone in the body."]},
 {id:"s3",h:"Bone structure",s:["Bones come in shapes: long (femur), short (wrist bones), flat (skull, ribs), and irregular (vertebrae).","A long bone has a shaft (diaphysis) and two ends (epiphyses).","In children, a growth plate (epiphyseal plate) near each end lets the bone grow longer.","Compact bone is hard and solid on the outside. Spongy bone is inside, at the ends. Spongy bone often holds red marrow."],
  m:["A tough membrane called the periosteum covers the outside of bones. It has nerves and blood vessels.","The hollow center of the shaft is the medullary cavity."]},
 {id:"s4",h:"Bone is alive: remodeling",s:["Bone is always being rebuilt.","[[osteoblast|Osteoblasts]] build new bone. [[osteoclast|Osteoclasts]] break bone down and release calcium into the blood. Osteocytes are mature bone cells that keep bone healthy.","Hormones control blood calcium. Parathyroid hormone (PTH) raises blood calcium. Calcitonin lowers it.","Vitamin D helps the gut absorb calcium."],
  tip:"Osteo-B = Build. Osteo-C = Chew (break down).",
  m:["Osteoporosis means bones lose mass and break easily. It is common in older adults, especially women after menopause, because estrogen helps protect bone."],
  nl:"Patients with osteoporosis can break a hip in a simple fall. Fall prevention is an important nursing job."},
 {id:"s5",h:"Joints",s:["A [[joint]] is where two bones meet.","Fibrous joints do not move, like the sutures of the skull.","Cartilaginous joints move a little, like the joints between vertebrae.","Synovial joints move freely, like the knee and shoulder. They have a fluid (synovial fluid) that reduces friction.","[[ligament|Ligaments]] connect bone to bone. [[tendon|Tendons]] connect muscle to bone."],
  tbl:[["Synovial joint","Movement","Example"],[["Hinge","Bends one way, like a door","Elbow, knee"],["Ball-and-socket","Moves in many directions","Shoulder, hip"],["Pivot","Rotates","Top of the neck (turning your head 'no')"],["Gliding (plane)","Slides","Between wrist bones"]]],
  chk:["What connects a muscle to a bone?",["A tendon","A ligament","Cartilage"],0,"Tendons connect muscle to bone. Ligaments connect bone to bone."]}
 ],
 say:["Osteoblasts ___ and osteoclasts ___. Ligaments connect ___, and tendons connect ___.","Osteoblasts build bone and osteoclasts break it down. Ligaments connect bone to bone, and tendons connect muscle to bone."],
 quiz:[
 ["c14q1","s1","mc","Where are blood cells made?",["Red bone marrow","Yellow bone marrow","Periosteum","Cartilage"],0,"Red marrow makes red cells, white cells, and platelets.","bone-marrow"],
 ["c14q2","s4","mc","Which cells build new bone?",["Osteoblasts","Osteoclasts","Neurons","Melanocytes"],0,"B for build.","osteoblast"],
 ["c14q3","s4","mc","Which hormone raises blood calcium?",["Parathyroid hormone (PTH)","Calcitonin","Insulin","Melatonin"],0,"PTH makes osteoclasts release calcium from bone.","osteoclast"],
 ["c14q4","s2","mc","Which bone is part of the axial skeleton?",["Rib","Femur","Humerus","Pelvis (hip bone)"],0,"The axial skeleton is the skull, spine, ribs, and sternum.","bone-marrow"],
 ["c14q5","s5","mc","The shoulder is which kind of joint?",["Ball-and-socket","Hinge","Pivot","Fibrous"],0,"Ball-and-socket joints move in many directions.","joint"],
 ["c14q6","s5","mc","What connects bone to bone?",["Ligament","Tendon","Cartilage","Skeletal muscle"],0,"Ligaments hold bones together at joints.","ligament"],
 ["c14q7","s3","mc","What lets a child's long bones grow longer?",["The growth (epiphyseal) plate","The periosteum","Yellow marrow","Compact bone"],0,"Growth plates add new bone until adulthood.","osteoblast"],
 ["c14q8","s1","mc","How many bones does an adult have?",["206","106","300","212"],0,"Babies have more, but many fuse, leaving 206 in adults.","bone-marrow"],
 ["c14q9","s4","tf","True or false: Vitamin D helps the body absorb calcium.",null,true,"Without vitamin D, the gut absorbs little calcium.","osteoblast"]
 ]},

{id:"c15",num:15,unit:3,teas:"S.1.6",emoji:"💪",title:"Muscles (Muscular System)",min:15,
 src:["Anatomy and Physiology 2e, Chapter 10 Muscle Tissue and Chapter 11 The Muscular System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["compare the three types of muscle","describe how a skeletal muscle contracts","explain how muscles work in pairs"],
 lang:"I can compare skeletal, smooth, and cardiac muscle using 'voluntary' and 'involuntary'.",
 sections:[
 {id:"s1",h:"Three types of muscle",s:["[[skeletal-muscle|Skeletal muscle]] is attached to bones. It is voluntary (you control it) and looks striped (striated).","[[cardiac-muscle|Cardiac muscle]] is only in the heart. It is involuntary and striated. Its cells are joined by intercalated discs so the heart beats together.","[[smooth-muscle|Smooth muscle]] is in the walls of organs and blood vessels, like the stomach, intestines, and bladder. It is involuntary and not striped."],
  tbl:[["","Skeletal","Cardiac","Smooth"],[["Where","Attached to bones","Heart","Walls of organs and vessels"],["Control","Voluntary","Involuntary","Involuntary"],["Stripes (striated)","Yes","Yes","No"],["Nuclei per cell","Many","One (sometimes two)","One"]]]},
 {id:"s2",h:"Jobs of muscles",s:["Muscles move the body and keep posture.","They make heat. Shivering is muscle contraction that warms you.","Smooth muscle moves things inside the body, like food (peristalsis) and urine.","The heart muscle pumps blood."]},
 {id:"s3",h:"How a skeletal muscle contracts",s:["A nerve signal reaches the muscle. The nerve releases a chemical called acetylcholine.","The muscle cell releases calcium from its storage (the sarcoplasmic reticulum).","Calcium lets myosin heads grab actin and pull it. The filaments slide past each other, and the muscle gets shorter. This is the sliding filament model.","Pulling needs [[atp|ATP]]. When calcium is pumped back, the muscle relaxes."],
  m:["The meeting place of a nerve and a muscle is the neuromuscular junction.","The basic contracting unit of a muscle fiber is the sarcomere.","After death, there is no ATP, so myosin cannot let go of actin. Muscles become stiff (rigor mortis)."],
  flow:["A motor neuron releases acetylcholine","The muscle cell gets an electrical signal","Calcium is released inside the muscle cell","Myosin heads attach to actin and pull, using ATP","The filaments slide and the muscle shortens","Calcium is pumped back and the muscle relaxes"]},
 {id:"s4",h:"Muscles work in pairs",s:["Muscles can only pull, not push. So they work in pairs.","The muscle that does the main movement is the agonist (prime mover). The muscle that does the opposite movement is the antagonist.","Example: the biceps bends (flexes) the elbow. The triceps straightens (extends) it."],
  m:["Flexion makes a joint angle smaller. Extension makes it bigger.","Abduction moves a limb away from the midline. Adduction moves it toward the midline ('add' it back to the body)."],
  chk:["The biceps flexes the elbow. Which muscle extends it?",["Triceps","Deltoid","Diaphragm"],0,"The triceps is the antagonist of the biceps."]},
 {id:"s5",h:"Muscle health",s:["Exercise makes muscle fibers bigger (hypertrophy).","Not using a muscle makes it smaller and weaker. This is [[atrophy]].","Muscles get ATP from several sources. With little oxygen, cells make ATP quickly but make lactic acid."],
  nl:"Long bed rest causes muscle atrophy. Helping patients move and walk early, when it is safe, protects their strength."}
 ],
 say:["Skeletal muscle is ___. Smooth muscle is ___. To contract, a muscle needs ___ and ___.","Skeletal muscle is voluntary and attached to bones. Smooth muscle is involuntary and in the walls of organs. To contract, a muscle needs calcium and ATP."],
 quiz:[
 ["c15q1","s1","mc","Which muscle type is voluntary?",["Skeletal","Cardiac","Smooth","All three"],0,"You choose when to move skeletal muscles.","skeletal-muscle"],
 ["c15q2","s1","mc","Which muscle type is found in the walls of the intestines?",["Smooth","Skeletal","Cardiac","None"],0,"Smooth muscle moves food by peristalsis.","smooth-muscle"],
 ["c15q3","s1","mc","Which muscle type has intercalated discs?",["Cardiac","Skeletal","Smooth","All three"],0,"Intercalated discs connect heart cells so they beat together.","cardiac-muscle"],
 ["c15q4","s3","mc","Which ion is released inside a muscle cell to start contraction?",["Calcium","Sodium chloride","Iron","Iodine"],0,"Calcium lets myosin bind to actin.","actin-myosin"],
 ["c15q5","s3","mc","Which neurotransmitter tells skeletal muscle to contract?",["Acetylcholine","Insulin","Dopamine","Melatonin"],0,"Motor neurons release acetylcholine at the neuromuscular junction.","neurotransmitter"],
 ["c15q6","s3","mc","In the sliding filament model, which protein pulls on actin?",["Myosin","Keratin","Collagen","Hemoglobin"],0,"Myosin heads grab actin and pull.","actin-myosin"],
 ["c15q7","s4","mc","Moving your arm away from the side of your body is…",["abduction","adduction","flexion","extension"],0,"Abduction = away. Adduction = toward ('add').","skeletal-muscle"],
 ["c15q8","s5","mc","What happens to muscles during long bed rest?",["They atrophy","They grow bigger","They turn into bone","They become cardiac muscle"],0,"Muscles that are not used get smaller and weaker.","atrophy"],
 ["c15q9","s2","tf","True or false: Shivering produces heat.",null,true,"Muscle contractions release heat.","skeletal-muscle"]
 ]},

{id:"c16",num:16,unit:3,teas:"S.1.5",emoji:"🧠",title:"Brain and Nerves (Nervous System)",min:18,
 src:["Anatomy and Physiology 2e, Chapters 12–16 (The Nervous System)","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["describe how the nervous system is organized","explain how a nerve signal travels","name the main parts of the brain and their jobs","describe a reflex arc"],
 lang:"I can explain the difference between sympathetic and parasympathetic using 'fight or flight' and 'rest and digest'.",
 sections:[
 {id:"s1",h:"How the nervous system is organized",s:["The [[cns|central nervous system (CNS)]] is the brain and spinal cord.","The peripheral nervous system (PNS) is all the nerves outside the CNS.","Sensory (afferent) nerves carry information to the CNS. Motor (efferent) nerves carry commands from the CNS.","The somatic nervous system controls skeletal muscles (voluntary). The autonomic nervous system controls organs automatically (involuntary).","The autonomic system has two parts. The [[sympathetic]] part is 'fight or flight'. The [[parasympathetic]] part is 'rest and digest'."],
  tbl:[["","Sympathetic (fight or flight)","Parasympathetic (rest and digest)"],[["Heart rate","Faster","Slower"],["Pupils","Wider (dilate)","Smaller (constrict)"],["Airways","Open wider","Narrower"],["Digestion","Slows down","Speeds up"]]]},
 {id:"s2",h:"Neurons",s:["A [[neuron]] is a nerve cell.","Dendrites receive signals. The cell body holds the nucleus. The axon carries the signal away.","Many axons are covered in [[myelin]]. Myelin makes signals travel much faster.","Glial cells support and protect neurons."],
  m:["In the PNS, Schwann cells make myelin. In the CNS, oligodendrocytes make myelin.","Multiple sclerosis (MS) is a disease where the immune system damages myelin in the CNS, so signals slow down."]},
 {id:"s3",h:"How a nerve signal travels",s:["A resting neuron is more negative inside (about −70 mV). The sodium-potassium pump helps keep it this way.","When the neuron is stimulated, sodium (Na⁺) rushes in. The inside becomes positive. This is an [[action-potential|action potential]].","Then potassium (K⁺) flows out, and the inside becomes negative again.","At the end of the axon, the neuron releases a [[neurotransmitter]] by exocytosis. It crosses a small gap (the [[synapse]]) and binds to the next cell."],
  m:["An action potential is all-or-none: it either fires fully or not at all.","Examples of neurotransmitters: acetylcholine (muscles), dopamine (movement and reward), serotonin (mood, sleep), and norepinephrine (alertness)."],
  flow:["The neuron rests at about −70 mV","A stimulus opens sodium channels","Na⁺ rushes in (depolarization)","K⁺ flows out (repolarization)","The signal travels down the axon","Neurotransmitter is released into the synapse"]},
 {id:"s4",h:"The brain",s:["The cerebrum is the largest part. It controls thinking, memory, language, and voluntary movement.","The [[cerebellum]] controls balance and coordination.","The [[brainstem|brainstem]] (midbrain, pons, and medulla oblongata) controls breathing, heart rate, and blood pressure.","The hypothalamus controls body temperature, hunger, thirst, and the pituitary gland."],
  tbl:[["Lobe of the cerebrum","Main jobs"],[["Frontal","Planning, decisions, personality, voluntary movement, speech production"],["Parietal","Touch, pain, temperature, body position"],["Temporal","Hearing, memory, understanding language"],["Occipital","Vision"]]],
  m:["The brain is protected by the skull, three membranes (the meninges), cerebrospinal fluid (CSF), and the blood-brain barrier.","The thalamus is a relay station for sensory information going to the cerebrum."],
  nl:"Signs of a stroke can be remembered with FAST: Face drooping, Arm weakness, Speech difficulty, Time to call emergency services."},
 {id:"s5",h:"Spinal cord and reflexes",s:["The spinal cord carries messages between the brain and the body.","There are 31 pairs of spinal nerves and 12 pairs of cranial nerves.","A [[reflex]] is a fast, automatic response. Many reflexes go through the spinal cord without waiting for the brain."],
  flow:["A receptor senses the stimulus (a hot stove)","A sensory neuron carries the signal to the spinal cord","An interneuron in the spinal cord passes it on","A motor neuron carries a command to a muscle","The muscle (effector) pulls the hand away"],
  chk:["Why are reflexes so fast?",["Many go through the spinal cord without waiting for the brain","They use hormones","They do not use neurons"],0,"The signal takes a short path through the spinal cord."]},
 {id:"s6",h:"Special senses: eyes and ears",s:["In the eye, light passes through the cornea and lens to the retina at the back.","The retina has rods and cones. Rods work in dim light. Cones see color and detail.","In the ear, the cochlea changes sound vibrations into nerve signals.","The vestibular parts of the inner ear help you keep your balance."]}
 ],
 say:["The CNS is ___. The sympathetic system ___, and the parasympathetic system ___.","The CNS is the brain and spinal cord. The sympathetic system prepares the body for fight or flight, and the parasympathetic system helps the body rest and digest."],
 quiz:[
 ["c16q1","s1","mc","What makes up the central nervous system?",["The brain and spinal cord","All the nerves in the arms and legs","The heart and lungs","Only the brain"],0,"CNS = brain + spinal cord.","cns"],
 ["c16q2","s1","mc","Which system causes a faster heart rate and wider pupils?",["Sympathetic","Parasympathetic","Somatic","Digestive"],0,"Sympathetic = fight or flight.","sympathetic"],
 ["c16q3","s2","mc","What does myelin do?",["Makes nerve signals travel faster","Makes neurotransmitters","Stores calcium","Makes new neurons"],0,"Myelin insulates the axon and speeds up the signal.","myelin"],
 ["c16q4","s3","mc","What happens first in an action potential?",["Sodium rushes into the neuron","Potassium rushes into the neuron","Calcium leaves the bone","The neuron releases insulin"],0,"Na⁺ entering makes the inside positive (depolarization).","action-potential"],
 ["c16q5","s4","mc","Which part of the brain controls balance and coordination?",["Cerebellum","Medulla oblongata","Frontal lobe","Hypothalamus"],0,"The cerebellum fine-tunes movement and balance.","cerebellum"],
 ["c16q6","s4","mc","Which part of the brain controls breathing and heart rate?",["Medulla oblongata (brainstem)","Occipital lobe","Cerebellum","Temporal lobe"],0,"The medulla in the brainstem controls vital functions.","brainstem"],
 ["c16q7","s4","mc","Which lobe of the cerebrum processes vision?",["Occipital","Frontal","Temporal","Parietal"],0,"The occipital lobe is at the back of the brain.","neuron"],
 ["c16q8","s3","mc","What carries a signal across a synapse?",["A neurotransmitter","Myelin","A hormone in the blood","A red blood cell"],0,"Neurotransmitters cross the synapse and bind to receptors.","neurotransmitter"],
 ["c16q9","s5","mc","What is the correct order of a reflex arc?",["Receptor, sensory neuron, interneuron, motor neuron, effector","Effector, motor neuron, brain, receptor","Brain, receptor, muscle, sensory neuron","Motor neuron, receptor, effector, interneuron"],0,"The signal goes in, through the spinal cord, and out to the muscle.","reflex"],
 ["c16q10","s6","tf","True or false: Cones in the retina let us see color.",null,true,"Cones see color and detail. Rods work in dim light.","neuron"]
 ]},

{id:"c17",num:17,unit:3,teas:"S.1.9",emoji:"🧪",title:"Hormones (Endocrine System)",min:15,
 src:["Anatomy and Physiology 2e, Chapter 17 The Endocrine System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["explain what hormones are and how they work","name the main glands and their hormones","explain how insulin and glucagon control blood sugar"],
 lang:"I can explain one hormone using 'is made by… and it…'.",
 sections:[
 {id:"s1",h:"What are hormones?",s:["A [[hormone]] is a chemical messenger. A [[gland]] releases it into the blood.","Hormones travel through the blood to target cells. Only cells with the right receptor respond.","Hormones act more slowly than nerve signals, but their effects last longer."],
  m:["Endocrine glands release hormones into the blood. Exocrine glands release substances through ducts, like sweat glands and salivary glands.","Most hormones are controlled by negative feedback."]},
 {id:"s2",h:"The hypothalamus and the pituitary",s:["The hypothalamus in the brain controls the [[pituitary|pituitary gland]].","The pituitary is sometimes called the 'master gland' because it controls many other glands.","The anterior (front) pituitary makes growth hormone, TSH (thyroid), ACTH (adrenal), FSH and LH (ovaries and testes), and prolactin (milk).","The posterior (back) pituitary releases ADH and oxytocin. ADH tells the kidneys to keep water. Oxytocin causes labor contractions and milk release."],
  m:["ADH and oxytocin are made in the hypothalamus and stored in the posterior pituitary."]},
 {id:"s3",h:"Other main glands",s:["The [[thyroid|thyroid]] makes T3 and T4. They control metabolism. The thyroid needs iodine. It also makes calcitonin, which lowers blood calcium.","The parathyroid glands make PTH, which raises blood calcium.","The [[adrenal|adrenal glands]] sit on the kidneys. They make cortisol (stress), aldosterone (keeps sodium and water), and epinephrine (adrenaline, fight or flight).","The pineal gland makes melatonin for sleep. The thymus helps T cells mature.","The ovaries make estrogen and progesterone. The testes make testosterone."],
  tbl:[["Gland","Hormone","Main effect"],[["Thyroid","T3, T4","Controls metabolism"],["Thyroid","Calcitonin","Lowers blood calcium"],["Parathyroid","PTH","Raises blood calcium"],["Adrenal cortex","Cortisol","Stress response, raises blood sugar"],["Adrenal cortex","Aldosterone","Keeps sodium and water, raises blood pressure"],["Adrenal medulla","Epinephrine","Fight or flight"],["Pancreas","Insulin","Lowers blood sugar"],["Pancreas","Glucagon","Raises blood sugar"],["Pineal","Melatonin","Sleep cycle"]]]},
 {id:"s4",h:"Blood sugar: insulin and glucagon",s:["The pancreas has small groups of cells called islets.","When blood sugar is high (after a meal), beta cells release [[insulin]]. Insulin helps cells take in glucose, and the liver stores glucose as glycogen. Blood sugar goes down.","When blood sugar is low, alpha cells release [[glucagon]]. Glucagon tells the liver to break down glycogen and release glucose. Blood sugar goes up.","This is negative feedback."],
  m:["Type 1 diabetes: the immune system destroys the beta cells, so the body makes little or no insulin.","Type 2 diabetes: the body's cells do not respond well to insulin (insulin resistance)."],
  flow:["You eat a meal and blood sugar rises","Beta cells in the pancreas release insulin","Cells take in glucose and the liver stores glycogen","Blood sugar falls back to normal"],
  nl:"Patients who take insulin can get low blood sugar (hypoglycemia). Signs include shaking, sweating, a fast heartbeat, and confusion.",
  chk:["Blood sugar is low. Which hormone does the pancreas release?",["Glucagon","Insulin","Melatonin"],0,"Glucagon raises blood sugar."]}
 ],
 say:["Insulin is made by ___ and it ___. Glucagon ___.","Insulin is made by the pancreas and it lowers blood sugar. Glucagon raises blood sugar."],
 quiz:[
 ["c17q1","s4","mc","Which hormone lowers blood sugar?",["Insulin","Glucagon","Cortisol","Epinephrine"],0,"Insulin helps cells take in glucose.","insulin"],
 ["c17q2","s4","mc","Which organ makes insulin and glucagon?",["Pancreas","Liver","Thyroid","Kidney"],0,"The islets of the pancreas make both.","insulin"],
 ["c17q3","s3","mc","Which gland needs iodine to make its hormones?",["Thyroid","Adrenal","Pineal","Thymus"],0,"T3 and T4 contain iodine.","thyroid"],
 ["c17q4","s2","mc","Which hormone tells the kidneys to keep water?",["ADH (antidiuretic hormone)","Insulin","Melatonin","Testosterone"],0,"ADH = antidiuretic, which means 'against urine'.","pituitary"],
 ["c17q5","s3","mc","Epinephrine (adrenaline) is made by the…",["adrenal glands","thyroid","pancreas","pituitary"],0,"The adrenal medulla makes epinephrine for fight or flight.","adrenal"],
 ["c17q6","s2","mc","Which gland is called the 'master gland'?",["Pituitary","Pineal","Thymus","Parathyroid"],0,"It controls the thyroid, adrenal glands, ovaries, and testes.","pituitary"],
 ["c17q7","s3","mc","Which hormone raises blood calcium?",["Parathyroid hormone (PTH)","Calcitonin","Insulin","Oxytocin"],0,"PTH raises calcium. Calcitonin lowers it.","gland"],
 ["c17q8","s1","mc","How do hormones reach their target cells?",["Through the blood","Through nerves only","Through ducts to the skin","Through the air"],0,"Endocrine glands release hormones into the blood.","hormone"],
 ["c17q9","s4","tf","True or false: In type 1 diabetes, the body makes little or no insulin.",null,true,"The immune system destroys the insulin-making beta cells.","insulin"]
 ]}
);

CHAPTERS.push(
{id:"c18",num:18,unit:3,teas:"S.1.3",emoji:"❤️",title:"Heart and Blood (Cardiovascular System)",min:18,
 src:["Anatomy and Physiology 2e, Chapters 18–20 (Blood, the Heart, Blood Vessels)","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["name the chambers and valves of the heart","trace blood through the heart and lungs","describe the heart's electrical system","compare arteries, veins, and capillaries"],
 lang:"I can trace the path of blood using 'from… to… through…'.",
 sections:[
 {id:"s1",h:"Jobs of the cardiovascular system",s:["The cardiovascular system is the heart, the blood vessels, and the blood.","It carries oxygen, nutrients, and hormones to cells. It takes away carbon dioxide and waste.","It also helps fight infection and control body temperature."]},
 {id:"s2",h:"The heart's chambers and valves",s:["The heart has four chambers. The two upper chambers are [[atrium|atria]]. They receive blood. The two lower chambers are [[ventricle|ventricles]]. They pump blood out.","The right side pumps blood to the lungs. The left side pumps blood to the whole body.","The left ventricle has the thickest wall because it pumps the hardest.","Four [[heart-valve|valves]] keep blood moving one way: tricuspid, pulmonary, mitral (bicuspid), and aortic."],
  m:["The tricuspid valve is between the right atrium and right ventricle. The mitral valve is between the left atrium and left ventricle.","The 'lub-dub' sound of the heartbeat is the valves closing.","The heart muscle gets its own blood from the coronary arteries. A blockage there causes a heart attack (myocardial infarction)."],
  tip:"'Try before you buy': the tricuspid comes before the bicuspid (mitral)."},
 {id:"s3",h:"The path of blood",s:["Blood from the body comes back through the vena cava into the right atrium.","It goes through the right ventricle to the lungs, where it picks up oxygen and drops off carbon dioxide.","Oxygen-rich blood returns to the left atrium, goes into the left ventricle, and is pumped out through the [[aorta]] to the body.","The trip to the lungs and back is pulmonary circulation. The trip to the body and back is systemic circulation."],
  flow:["Superior and inferior vena cava (from the body)","Right atrium","Tricuspid valve","Right ventricle","Pulmonary valve","Pulmonary arteries","Lungs (pick up oxygen)","Pulmonary veins","Left atrium","Mitral (bicuspid) valve","Left ventricle","Aortic valve","Aorta (to the body)"],
  m:["Pulmonary arteries carry oxygen-poor blood, and pulmonary veins carry oxygen-rich blood. They are named by direction (away from or toward the heart), not by oxygen."]},
 {id:"s4",h:"The heart's electrical system",s:["The [[sa-node|SA node]] in the right atrium starts each heartbeat. It is the heart's natural pacemaker.","The signal spreads across the atria, then to the AV node, which delays it a little.","Then it travels down the bundle of His and the Purkinje fibers, and the ventricles contract.","A normal adult resting heart rate is 60 to 100 beats per minute."],
  m:["On an ECG: the P wave = atria depolarize, the QRS complex = ventricles depolarize, the T wave = ventricles repolarize (recover).","Cardiac output = heart rate × stroke volume (blood pumped in one beat)."],
  flow:["SA node","Atria contract","AV node (short delay)","Bundle of His","Bundle branches","Purkinje fibers","Ventricles contract"]},
 {id:"s5",h:"Blood vessels and blood",s:["[[artery|Arteries]] carry blood away from the heart. They have thick, muscular walls and high pressure.","[[vein|Veins]] carry blood back to the heart. They have thinner walls and valves that stop blood from flowing backward.","[[capillary|Capillaries]] are tiny. Their walls are one cell thick, so oxygen, nutrients, and waste can pass in and out.","Blood is about 55% plasma (liquid) and 45% cells: red blood cells carry oxygen with [[hemoglobin]], white blood cells fight infection, and [[platelet|platelets]] help clotting."],
  tip:"Arteries = Away from the heart.",
  m:["[[blood-pressure|Blood pressure]] has two numbers. Systolic is the pressure when the ventricles contract. Diastolic is the pressure when they relax. Normal adult blood pressure is less than 120/80 mmHg."],
  nl:"Nurses check pulse and blood pressure as vital signs. A blood pressure of 140/90 or higher on repeated checks may mean hypertension.",
  chk:["Which vessels have walls only one cell thick?",["Capillaries","Arteries","Veins"],0,"Thin walls let gases and nutrients pass."]}
 ],
 say:["Blood from the body enters the ___. It goes to the ___ to get oxygen. Then the ___ pumps it to the body.","Blood from the body enters the right atrium. It goes to the lungs to get oxygen. Then the left ventricle pumps it to the body."],
 quiz:[
 ["c18q1","s3","mc","Where does oxygen-poor blood from the body enter the heart?",["Right atrium","Left atrium","Left ventricle","Aorta"],0,"The vena cava empties into the right atrium.","atrium"],
 ["c18q2","s2","mc","Which chamber has the thickest muscle wall?",["Left ventricle","Right atrium","Left atrium","Right ventricle"],0,"It pumps blood to the whole body.","ventricle"],
 ["c18q3","s3","mc","Which vessel carries oxygen-poor blood to the lungs?",["Pulmonary artery","Pulmonary vein","Aorta","Vena cava"],0,"Arteries carry blood away from the heart, even when it is low in oxygen.","artery"],
 ["c18q4","s2","mc","Which valve is between the left atrium and the left ventricle?",["Mitral (bicuspid)","Tricuspid","Pulmonary","Aortic"],0,"Tricuspid on the right, mitral on the left.","heart-valve"],
 ["c18q5","s4","mc","What is the heart's natural pacemaker?",["SA node","AV node","Purkinje fibers","Aortic valve"],0,"The SA node starts each beat.","sa-node"],
 ["c18q6","s5","mc","Which blood vessels have valves to stop backflow?",["Veins","Arteries","Capillaries","The aorta"],0,"Veins have low pressure, so valves help blood go toward the heart.","vein"],
 ["c18q7","s5","mc","What carries oxygen in red blood cells?",["Hemoglobin","Platelets","Plasma","Insulin"],0,"Hemoglobin contains iron, which binds oxygen.","hemoglobin"],
 ["c18q8","s4","mc","On an ECG, what does the QRS complex show?",["The ventricles depolarizing","The atria depolarizing","The ventricles recovering","The valves opening"],0,"P = atria, QRS = ventricles, T = ventricles recovering.","sa-node"],
 ["c18q9","s5","mc","What is a normal adult resting heart rate?",["60 to 100 beats per minute","20 to 40 beats per minute","120 to 160 beats per minute","10 to 20 beats per minute"],0,"60–100 is the normal adult resting range.","sa-node"],
 ["c18q10","s5","tf","True or false: Platelets help blood clot.",null,true,"Platelets plug small breaks in blood vessels.","platelet"]
 ]},

{id:"c19",num:19,unit:3,teas:"S.1.2",emoji:"🫁",title:"Lungs and Breathing (Respiratory System)",min:15,
 src:["Anatomy and Physiology 2e, Chapter 22 The Respiratory System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["trace the path of air into the lungs","explain gas exchange in the alveoli","explain how breathing works and how it is controlled"],
 lang:"I can explain gas exchange using 'high', 'low', and 'diffuses'.",
 sections:[
 {id:"s1",h:"The path of air",s:["Air enters through the nose or mouth. The nose warms, cleans, and moistens the air.","Air passes through the pharynx (throat) and the larynx (voice box).","The [[epiglottis]] covers the larynx when you swallow, so food goes down the esophagus.","Then air goes down the [[trachea]] (windpipe), into the two bronchi, then into smaller bronchioles, and finally into the [[alveoli]]."],
  m:["The trachea has C-shaped rings of cartilage that keep it open.","The airways are lined with mucus and cilia that trap and remove dirt and germs.","The right lung has 3 lobes. The left lung has 2 lobes, which leaves room for the heart."],
  flow:["Nose or mouth","Pharynx (throat)","Larynx (voice box)","Trachea (windpipe)","Bronchi","Bronchioles","Alveoli"]},
 {id:"s2",h:"Gas exchange in the alveoli",s:["The alveoli are tiny air sacs. They are surrounded by capillaries.","Oxygen is high in the alveoli and low in the blood, so oxygen diffuses into the blood.","Carbon dioxide is high in the blood and low in the alveoli, so it diffuses out and you breathe it out.","This is the same diffusion you learned in Chapter 3: from high to low, with no energy."],
  m:["The walls of alveoli and capillaries are very thin, so gases cross quickly.","[[surfactant|Surfactant]] coats the alveoli and keeps them from collapsing. Very premature babies may not have enough.","Most oxygen in the blood is carried by hemoglobin. Most carbon dioxide is carried as bicarbonate."],
  chk:["Why does oxygen move from the alveoli into the blood?",["Oxygen is higher in the alveoli, so it diffuses to where it is lower","A pump pushes it","The heart pulls it"],0,"Gas exchange is diffusion, from high to low concentration."]},
 {id:"s3",h:"How breathing works",s:["To breathe in, the [[diaphragm]] contracts and moves down. The muscles between the ribs lift the ribs up and out.","The chest gets bigger, so the pressure inside goes down. Air flows in.","To breathe out, the diaphragm relaxes and moves up. The chest gets smaller, and air flows out. Normal breathing out needs no effort."],
  an:"Breathing in is like pulling out the handle of a syringe: the space gets bigger and air rushes in."},
 {id:"s4",h:"Control of breathing",s:["The brainstem (medulla oblongata and pons) controls breathing.","The main signal is carbon dioxide. When CO₂ rises, the blood becomes more acidic, and you breathe faster and deeper.","A normal adult breathes about 12 to 20 times per minute at rest."],
  nl:"Nurses measure oxygen saturation with a pulse oximeter. For most healthy adults, a normal reading is about 95% to 100%."}
 ],
 say:["Air goes from the trachea to the ___ and then to the ___. In the alveoli, oxygen ___ and carbon dioxide ___.","Air goes from the trachea to the bronchi and then to the alveoli. In the alveoli, oxygen diffuses into the blood and carbon dioxide diffuses out."],
 quiz:[
 ["c19q1","s1","mc","Where does gas exchange happen in the lungs?",["Alveoli","Trachea","Bronchi","Larynx"],0,"Alveoli are surrounded by capillaries.","alveoli"],
 ["c19q2","s1","mc","Which structure keeps food from entering the trachea?",["Epiglottis","Diaphragm","Bronchus","Alveolus"],0,"The epiglottis covers the airway when you swallow.","epiglottis"],
 ["c19q3","s3","mc","What does the diaphragm do when you breathe in?",["It contracts and moves down","It relaxes and moves up","It closes the trachea","It pushes air out"],0,"This makes the chest bigger, so air flows in.","diaphragm"],
 ["c19q4","s4","mc","What is the main chemical signal that makes you breathe faster?",["Rising carbon dioxide","Rising oxygen","Falling glucose","Rising calcium"],0,"More CO₂ makes the blood more acidic, which the brainstem senses.","diaphragm"],
 ["c19q5","s2","mc","How do oxygen and carbon dioxide cross the alveolar wall?",["Diffusion","Active transport","Exocytosis","Filtration"],0,"Gases move from high to low concentration.","alveoli"],
 ["c19q6","s1","mc","What is the correct path of air?",["Trachea, bronchi, bronchioles, alveoli","Bronchi, trachea, alveoli, bronchioles","Alveoli, trachea, bronchi, larynx","Bronchioles, larynx, trachea, bronchi"],0,"Air goes from the biggest tube to the smallest sacs.","trachea"],
 ["c19q7","s2","mc","What keeps the alveoli from collapsing?",["Surfactant","Mucus","Bile","Plasma"],0,"Surfactant lowers surface tension in the alveoli.","surfactant"],
 ["c19q8","s1","mc","How many lobes does the left lung have?",["2","3","4","1"],0,"Left 2, right 3. The heart takes up space on the left.","alveoli"],
 ["c19q9","s4","tf","True or false: A normal adult resting breathing rate is about 12 to 20 breaths per minute.",null,true,"12–20 is the normal adult range.","diaphragm"]
 ]},

{id:"c20",num:20,unit:3,teas:"S.1.4",emoji:"🍽️",title:"Digestion (Digestive System)",min:16,
 src:["Anatomy and Physiology 2e, Chapter 23 The Digestive System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["trace the path of food","describe what happens in the mouth, stomach, small intestine, and large intestine","name the jobs of the liver, gallbladder, and pancreas"],
 lang:"I can explain where each nutrient is digested using 'starts in… and finishes in…'.",
 sections:[
 {id:"s1",h:"The path of food",s:["The digestive tract is one long tube from the mouth to the anus.","Food is moved along by [[peristalsis]], waves of smooth muscle squeezing.","Accessory organs help but food does not pass through them: the teeth, tongue, salivary glands, [[liver]], gallbladder, and pancreas."],
  flow:["Mouth","Pharynx","Esophagus","Stomach","Small intestine (duodenum, jejunum, ileum)","Large intestine (cecum, colon, rectum)","Anus"]},
 {id:"s2",h:"Mouth, esophagus, and stomach",s:["In the mouth, teeth break food into small pieces (mechanical digestion). Saliva has an enzyme, amylase, that starts breaking down starch.","The esophagus carries food to the [[stomach]].","The stomach makes strong acid (HCl) and the enzyme pepsin, which starts protein digestion. It churns food into a thick liquid called chyme.","Thick mucus protects the stomach wall from its own acid."],
  m:["The lower esophageal sphincter keeps acid in the stomach. When it is weak, acid can flow back up. This is heartburn or GERD.","Stomach acid also kills many germs in food."]},
 {id:"s3",h:"The small intestine and helper organs",s:["Most digestion and almost all absorption happen in the [[small-intestine|small intestine]].","The liver makes [[bile]]. The gallbladder stores it. Bile breaks fat into small drops so enzymes can work.","The pancreas sends enzymes that digest carbohydrates, proteins, and fats. It also sends bicarbonate to neutralize stomach acid.","The wall of the small intestine has [[villi]] and microvilli. They give a huge surface area for absorbing nutrients."],
  m:["The first part of the small intestine is the duodenum. It receives bile and pancreatic juice.","Sugars and amino acids go into the blood capillaries in the villi. Fats go into small lymph vessels called lacteals.","The liver also stores glycogen, breaks down drugs and toxins, and makes blood proteins like albumin and clotting factors."],
  tbl:[["Nutrient","Digestion starts in","Main enzymes"],[["Carbohydrates","Mouth","Salivary and pancreatic amylase"],["Proteins","Stomach","Pepsin, then pancreatic enzymes like trypsin"],["Fats","Small intestine","Bile (breaks fat into drops) and pancreatic lipase"]]],

 {id:"s4",h:"The large intestine",s:["The [[large-intestine|large intestine]] absorbs water and salts. This forms solid stool (feces).","Bacteria in the large intestine make vitamin K and some B vitamins.","The appendix is a small tube attached to the first part of the large intestine (the cecum)."],
  nl:"Patients who have trouble swallowing can get food or liquid into their airway (aspiration). Nurses help them sit upright to eat and watch for coughing or choking."}
 ],

{id:"c21",num:21,unit:3,teas:"S.1.10",emoji:"🫘",title:"Kidneys and Urine (Urinary System)",min:15,
 src:["Anatomy and Physiology 2e, Chapter 25 The Urinary System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["name the organs of the urinary system","describe how a nephron makes urine","explain how hormones control water and salt"],
 lang:"I can describe the three steps of urine formation in order.",
 sections:[
 {id:"s1",h:"Jobs of the kidneys",s:["The [[kidney|kidneys]] filter the blood and remove wastes like urea and creatinine.","They balance water, salts (electrolytes), and pH.","They help control blood pressure.","They make a hormone (erythropoietin, EPO) that tells bone marrow to make red blood cells. They also activate vitamin D."]},
 {id:"s2",h:"The parts of the urinary system",s:["Two kidneys make urine.","Two [[ureter|ureters]] carry urine to the bladder.","The [[bladder|bladder]] stores urine.","The [[urethra]] carries urine out of the body."],
  m:["The female urethra is much shorter than the male urethra. This is one reason urinary tract infections (UTIs) are more common in women."],
  flow:["Kidney","Ureter","Urinary bladder","Urethra","Out of the body"]},
 {id:"s3",h:"The nephron: how urine is made",s:["Each kidney has about one million [[nephron|nephrons]].","Step 1, filtration: blood pressure pushes water and small molecules out of a ball of capillaries (the glomerulus) into the nephron. Blood cells and big proteins stay in the blood.","Step 2, reabsorption: the nephron takes back what the body needs, like glucose, most water, and salts.","Step 3, secretion: the nephron adds some extra wastes and ions from the blood to the urine."],
  m:["The parts of the nephron in order: glomerulus and Bowman's capsule, proximal convoluted tubule, loop of Henle, distal convoluted tubule, and collecting duct.","Most reabsorption happens in the proximal convoluted tubule. The loop of Henle helps make urine concentrated."],
  flow:["Glomerulus and Bowman's capsule (filtration)","Proximal convoluted tubule (most reabsorption)","Loop of Henle (concentrates urine)","Distal convoluted tubule (fine-tuning)","Collecting duct (water control by ADH)","Renal pelvis, then ureter"],
  chk:["In a healthy kidney, which of these normally stays in the blood instead of going into the filtrate?",["Red blood cells","Water","Urea"],0,"Blood cells and large proteins are too big to be filtered."]},
 {id:"s4",h:"Hormones that control the kidneys",s:["ADH (from the posterior pituitary) makes the collecting ducts take back more water. You make less urine, and it is darker.","Aldosterone (from the adrenal glands) makes the kidneys keep sodium. Water follows sodium, so blood volume and blood pressure go up.","When blood pressure is low, the kidneys release renin. This starts a chain that raises blood pressure."],
  m:["Alcohol blocks ADH. This is why drinking alcohol makes you urinate more."]},
 {id:"s5",h:"What urine tells us",s:["Normal urine is clear and pale yellow. It is mostly water, plus urea, salts, and other wastes.","Glucose in urine can be a sign of diabetes. Protein in urine can be a sign of kidney damage. Blood in urine needs to be checked."],
  nl:"Nurses measure urine output. For adults, less than about 30 mL per hour can be a warning sign of dehydration or kidney problems."}
 ],
 say:["Urine is made in three steps: ___, ___, and ___. ADH makes the body keep ___.","Urine is made in three steps: filtration, reabsorption, and secretion. ADH makes the body keep water."],
 quiz:[
 ["c21q1","s3","mc","What is the working unit of the kidney?",["Nephron","Neuron","Alveolus","Villus"],0,"Each kidney has about a million nephrons.","nephron"],
 ["c21q2","s2","mc","Which tube carries urine from the kidney to the bladder?",["Ureter","Urethra","Esophagus","Vas deferens"],0,"Ureter goes kidney → bladder. Urethra goes bladder → outside.","ureter"],
 ["c21q3","s3","mc","Where does filtration happen?",["Glomerulus","Bladder","Loop of Henle","Urethra"],0,"Blood pressure pushes fluid out of the glomerulus.","nephron"],
 ["c21q4","s4","mc","What does ADH do?",["Makes the kidneys keep more water","Makes the kidneys release more water","Raises blood sugar","Breaks down bone"],0,"More water is reabsorbed, so urine is less and darker.","kidney"],
 ["c21q5","s4","mc","Aldosterone makes the kidneys keep…",["sodium (and water follows)","glucose","red blood cells","urea"],0,"Water follows sodium, so blood pressure rises.","kidney"],
 ["c21q6","s1","mc","Which hormone from the kidneys tells the body to make red blood cells?",["Erythropoietin (EPO)","Insulin","Renin","Melatonin"],0,"Low oxygen triggers EPO release.","kidney"],
 ["c21q7","s5","mc","Glucose in the urine can be a sign of…",["diabetes","a healthy kidney","dehydration only","a broken bone"],0,"When blood sugar is very high, the kidneys cannot take all of it back.","kidney"],
 ["c21q8","s2","mc","Why do women get more UTIs than men?",["Their urethra is shorter","They have three kidneys","They have no bladder","Their ureters are longer"],0,"Bacteria have a shorter distance to travel to the bladder.","urethra"],
 ["c21q9","s3","tf","True or false: In reabsorption, the nephron takes back useful things like glucose and water.",null,true,"Reabsorption returns needed substances to the blood.","nephron"]
 ]},

{id:"c22",num:22,unit:3,teas:"S.1.11",emoji:"🛡️",title:"Immunity and the Lymphatic System",min:17,
 src:["Anatomy and Physiology 2e, Chapter 21 The Lymphatic and Immune System","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["describe the lymphatic organs","compare innate and adaptive immunity","explain how B cells, T cells, and antibodies work","compare active and passive immunity"],
 lang:"I can compare innate and adaptive immunity using 'fast', 'slow', 'general', and 'specific'.",
 sections:[
 {id:"s1",h:"The lymphatic system",s:["Some fluid leaks out of blood capillaries into tissues. Lymph vessels collect it and return it to the blood. This fluid is called [[lymph]].","Lymph nodes filter lymph and hold many white blood cells. Nodes can swell during an infection.","The spleen filters blood and removes old red blood cells.","The thymus is where T cells mature. Bone marrow makes all blood cells, including white blood cells.","Tonsils protect the entrance to the throat."]},
 {id:"s2",h:"Innate immunity: the first and second lines",s:["Innate immunity is fast and general. You are born with it.","First line of defense: barriers. Skin, mucous membranes, mucus and cilia, stomach acid, and tears.","Second line of defense: [[inflammation]], fever, and [[phagocyte|phagocytes]] (cells that eat germs). Natural killer cells destroy infected cells.","Signs of inflammation are redness, heat, swelling, and pain."],
  m:["Neutrophils are the most common white blood cell. They arrive first at an infection. Macrophages are large phagocytes that also show pieces of germs to T cells.","Tears and saliva contain lysozyme, an enzyme that damages bacteria."]},
 {id:"s3",h:"Adaptive immunity: the third line",s:["Adaptive immunity is slower the first time, but very specific. It also has memory.","It reacts to [[antigen|antigens]], molecules that the body recognizes as foreign.","[[b-cell|B cells]] become plasma cells that make [[antibody|antibodies]]. This is humoral immunity.","[[t-cell|T cells]] work in cell-mediated immunity. Helper T cells (CD4) lead the response. Cytotoxic T cells (CD8) kill infected cells.","Memory cells stay in the body. If the same germ comes back, the response is much faster and stronger."],
  m:["HIV infects helper T cells. Without enough helper T cells, the whole immune response is weak. This is AIDS."],
  tbl:[["","Innate","Adaptive"],[["Speed","Fast (minutes to hours)","Slower the first time (days)"],["Targets","General, many germs","Specific to one antigen"],["Memory","No","Yes"],["Examples","Skin, inflammation, fever, phagocytes","B cells, antibodies, T cells"]]]},
 {id:"s4",h:"Antibodies",s:["Antibodies are Y-shaped proteins. Each one fits one antigen, like a key in a lock.","They mark germs for destruction, block germs from entering cells, and clump germs together."],
  tbl:[["Antibody","Remember it as"],[["IgG","Most common; crosses the placenta to protect the baby"],["IgM","First antibody made in a new infection"],["IgA","In saliva, tears, mucus, and breast milk"],["IgE","Allergies and parasites"],["IgD","On the surface of B cells"]]]},
 {id:"s5",h:"Kinds of immunity and immune problems",s:["Active immunity: your own body makes antibodies and memory cells. It comes from an infection or a [[vaccine]]. It lasts a long time.","Passive immunity: you receive antibodies made by someone else. A baby gets them through the placenta and breast milk. It works quickly but lasts only weeks to months.","Allergies: the immune system overreacts to something harmless. A severe allergic reaction (anaphylaxis) is an emergency.","[[autoimmune|Autoimmune diseases]]: the immune system attacks the body's own cells. Examples: type 1 diabetes, rheumatoid arthritis, lupus."],
  nl:"Hand hygiene, vaccines, and watching for signs of infection (fever, redness, swelling, pus) are everyday nursing tasks that support the immune system.",
  chk:["A person gets a vaccine and makes their own antibodies. What kind of immunity is this?",["Active immunity","Passive immunity","Innate immunity"],0,"Their own immune system made the antibodies and memory cells."]}
 ],
 say:["Innate immunity is ___. Adaptive immunity is ___ and has ___. B cells make ___.","Innate immunity is fast and general. Adaptive immunity is specific and has memory. B cells make antibodies."],
 quiz:[
 ["c22q1","s3","mc","Which cells make antibodies?",["B cells (plasma cells)","Red blood cells","Platelets","Neurons"],0,"B cells turn into plasma cells that release antibodies.","b-cell"],
 ["c22q2","s3","mc","Which cells does HIV attack?",["Helper T cells","Red blood cells","Platelets","Neutrophils"],0,"HIV infects CD4 helper T cells.","t-cell"],
 ["c22q3","s2","mc","Which is part of the first line of defense?",["Skin","Antibodies","Memory T cells","Vaccines"],0,"Skin is a physical barrier.","phagocyte"],
 ["c22q4","s2","mc","What are the signs of inflammation?",["Redness, heat, swelling, and pain","Pale, cold, and numb skin","Low heart rate and low temperature","Itching only"],0,"More blood flow causes redness and heat. Fluid causes swelling.","inflammation"],
 ["c22q5","s4","mc","Which antibody crosses the placenta?",["IgG","IgE","IgA","IgM"],0,"IgG gives the baby passive immunity before birth.","antibody"],
 ["c22q6","s5","mc","A baby gets antibodies from breast milk. What kind of immunity is this?",["Passive","Active","Innate","Autoimmune"],0,"The baby receives antibodies made by the mother.","antibody"],
 ["c22q7","s3","mc","What makes adaptive immunity faster the second time?",["Memory cells","Stomach acid","Fever","Platelets"],0,"Memory B and T cells remember the antigen.","vaccine"],
 ["c22q8","s1","mc","Where do T cells mature?",["Thymus","Spleen","Liver","Lymph nodes"],0,"T = thymus.","t-cell"],
 ["c22q9","s5","mc","Rheumatoid arthritis, where the immune system attacks the joints, is an example of…",["an autoimmune disease","an allergy","passive immunity","an infection"],0,"The immune system attacks the body's own tissue.","autoimmune"],
 ["c22q10","s2","tf","True or false: Neutrophils are usually the most common white blood cell.",null,true,"Neutrophils are the first responders to bacterial infection.","phagocyte"]
 ]},

{id:"c23",num:23,unit:3,teas:"S.1.7",emoji:"👶",title:"The Reproductive System",min:15,
 src:["Anatomy and Physiology 2e, Chapters 27–28 (The Reproductive System; Development and Inheritance)","https://openstax.org/details/books/anatomy-and-physiology-2e"],
 goals:["name the male and female reproductive organs and their jobs","describe the ovarian and menstrual cycles","describe fertilization and early pregnancy"],
 lang:"I can describe the menstrual cycle in order using time words like 'first', 'around day 14', and 'then'.",
 sections:[
 {id:"s1",h:"The big picture",s:["The reproductive system makes sex cells (gametes) and sex hormones.","The gonads are the [[testes]] in males and the [[ovary|ovaries]] in females.","Gametes are made by meiosis (Chapter 9), so they have 23 chromosomes."]},
 {id:"s2",h:"The male reproductive system",s:["The testes make sperm and [[testosterone]].","The testes sit in the scrotum, outside the body, where it is a little cooler. Sperm develop best a few degrees below body temperature.","Sperm mature in the epididymis. Then they travel through the vas deferens and the urethra.","The seminal vesicles, prostate, and bulbourethral glands add fluid to make semen."],
  m:["Sperm are made in the seminiferous tubules of the testes.","The pituitary hormones FSH and LH control sperm and testosterone production."],
  flow:["Seminiferous tubules (testes): sperm are made","Epididymis: sperm mature","Vas deferens","Ejaculatory duct","Urethra"]},
 {id:"s3",h:"The female reproductive system",s:["The ovaries hold eggs (oocytes) and make [[estrogen]] and progesterone.","The [[fallopian|uterine (fallopian) tubes]] carry the egg to the uterus. Fertilization usually happens in the tube.","The [[uterus]] is a muscular organ. Its inner lining (endometrium) is where an embryo implants.","The cervix is the lower part of the uterus. It opens into the vagina."]},
 {id:"s4",h:"The monthly cycle",s:["A typical cycle is about 28 days, but it varies from person to person.","FSH from the pituitary helps an egg follicle grow. The follicle makes estrogen, and the uterine lining gets thicker.","Around the middle of the cycle, a surge of LH causes [[ovulation]]: the ovary releases an egg.","The empty follicle becomes the corpus luteum. It makes progesterone, which keeps the lining ready.","If there is no pregnancy, the corpus luteum breaks down. Progesterone drops, and the lining is shed. This is menstruation."],
  flow:["FSH helps a follicle grow","Estrogen rises and the lining thickens","An LH surge causes ovulation","The corpus luteum makes progesterone","No pregnancy: progesterone drops","The lining is shed (menstruation)"],
  chk:["Which hormone surge causes ovulation?",["LH","Insulin","ADH"],0,"A surge of luteinizing hormone (LH) triggers ovulation."]},
 {id:"s5",h:"Fertilization and pregnancy",s:["When a sperm (23 chromosomes) joins an egg (23 chromosomes), they form a zygote with 46 chromosomes.","The zygote divides by mitosis as it moves to the uterus. It implants in the endometrium.","The [[placenta]] forms. It passes oxygen and nutrients from mother to fetus and removes waste.","The early embryo and placenta make hCG. hCG keeps the corpus luteum working. Pregnancy tests detect hCG."],
  m:["During labor, oxytocin causes contractions. Contractions cause more oxytocin. This is positive feedback (Chapter 12).","After birth, prolactin makes milk, and oxytocin helps release it."],
  nl:"Many medicines and substances, like alcohol, can cross the placenta. This is why nurses always check if a patient may be pregnant before some medicines and X-rays."}
 ],
 say:["The testes make ___. The ovaries make ___. Fertilization usually happens in the ___.","The testes make sperm and testosterone. The ovaries make eggs, estrogen, and progesterone. Fertilization usually happens in the uterine tube."],
 quiz:[
 ["c23q1","s2","mc","Where are sperm made?",["Testes","Prostate","Epididymis","Urethra"],0,"Sperm are made in the seminiferous tubules of the testes.","testes"],
 ["c23q2","s2","mc","Where do sperm mature?",["Epididymis","Bladder","Seminal vesicle","Ovary"],0,"The epididymis stores sperm while they mature.","testes"],
 ["c23q3","s3","mc","Where does fertilization usually happen?",["Uterine (fallopian) tube","Uterus","Ovary","Cervix"],0,"The egg is usually fertilized in the tube on its way to the uterus.","fallopian"],
 ["c23q4","s4","mc","What happens at ovulation?",["The ovary releases an egg","The lining is shed","The placenta forms","The embryo implants"],0,"An LH surge makes the follicle release its egg.","ovulation"],
 ["c23q5","s4","mc","Which hormone keeps the uterine lining ready after ovulation?",["Progesterone","Testosterone","Insulin","Melatonin"],0,"The corpus luteum makes progesterone.","estrogen"],
 ["c23q6","s5","mc","Which hormone do pregnancy tests detect?",["hCG","FSH","ADH","Cortisol"],0,"hCG is made by the early embryo and placenta.","placenta"],
 ["c23q7","s5","mc","How many chromosomes does a human zygote have?",["46","23","92","12"],0,"23 from the sperm + 23 from the egg = 46.","gamete"],
 ["c23q8","s3","mc","Which organ is where a fetus grows?",["Uterus","Ovary","Bladder","Uterine tube"],0,"The embryo implants in the uterine lining and grows in the uterus.","uterus"],
 ["c23q9","s5","tf","True or false: The placenta passes oxygen and nutrients from the mother to the fetus.",null,true,"The placenta also removes the fetus's waste.","placenta"]
 ]}
);

CHAPTERS.forEach(ch=>{if(!ch.unit){ch.unit=1;ch.teas="S.2.1";}});
const UNITS={1:{name:"Cells and Transport",sub:"How cells are built and how things move in and out"},2:{name:"Biology for Nursing",sub:"Organelles, molecules, DNA, genetics, and microbes"},3:{name:"The Human Body",sub:"Anatomy and physiology of all 11 body systems"}};
const CH_BY={}; const QBY={};
CHAPTERS.forEach(ch=>{CH_BY[ch.id]=ch; ch.quiz.forEach(q=>{QBY[q[0]]={q,ch}});});
const TERM_CH={};
CHAPTERS.forEach(ch=>ch.sections.forEach(sec=>[...sec.s,...(sec.m||[])].join(" ").replace(/\[\[([a-z0-9-]+)/g,(_,id)=>{if(!TERM_CH[id])TERM_CH[id]=ch.id;return ""})));

/* ============================================================
   STATE (saved in this browser only)
   ============================================================ */
const LS_KEY="cellwise-v1";
function defaultState(){return {settings:{lang:"none",other:"",size:"m",rate:0.9,detail:false},ch:{},deck:{}}}
let S=defaultState();
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);const def=defaultState();S={...def,...d,settings:{...def.settings,...(d.settings||{})},ch:d.ch||{},deck:d.deck||{}};}}catch(e){}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function chState(id){if(!S.ch[id])S.ch[id]={read:false,best:null,attempts:0,mastered:false,missed:[]};return S.ch[id];}
const DAY=864e5, INTERVALS=[0,1,3,7,14,30];
function schedule(id,correct){const d=S.deck[id]||{box:0,due:0};if(correct){d.box=Math.min(Math.max(d.box,1)+1,5);}else{d.box=1;}d.due=Date.now()+INTERVALS[d.box]*DAY-3*3600e3;S.deck[id]=d;}
function dueIds(){const now=Date.now();return Object.keys(S.deck).filter(id=>QBY[id]&&S.deck[id].due<=now);}

/* ============================================================
   HELPERS
   ============================================================ */
const $=s=>document.querySelector(s);
const app=$("#app");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rich(s){return esc(s).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g,(_,id,txt)=>{const g=G[id];const label=txt||(g?g[0]:id);return g?`<button class="term" data-term="${id}" aria-label="${esc(label)}: show meaning">${label}</button>`:label;});}
function plain(s){return String(s).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g,(_,id,txt)=>txt||(G[id]?G[id][0]:id));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tr(id){const L=LANGS[S.settings.lang];return L&&G[id]?G[id][L.i]:"";}
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function helpLangName(){if(S.settings.lang==="other")return (S.settings.other||"").trim();const L=LANGS[S.settings.lang];return L?L.name:"";}

/* ---------- read aloud ---------- */
const canSpeak="speechSynthesis" in window;
let speakingBtn=null;
function speechStop(){try{if(canSpeak)speechSynthesis.cancel()}catch(e){}if(speakingBtn){speakingBtn.classList.remove("on");speakingBtn.textContent="🔊 Listen";speakingBtn=null;}}
function speak(text,btn){if(!canSpeak)return;if(btn&&speakingBtn===btn){speechStop();return;}speechStop();try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=S.settings.rate;u.onend=()=>{if(speakingBtn===btn)speechStop()};if(btn){speakingBtn=btn;btn.classList.add("on");btn.textContent="⏹ Stop";}speechSynthesis.speak(u);}catch(e){}}
function listenBtn(text){return canSpeak?`<button class="listen" data-say="${esc(text)}">🔊 Listen</button>`:"";}

/* ---------- word popover ---------- */
let pop=null;
function closePop(){if(pop){pop.remove();pop=null;}}
function openPop(id,anchor){closePop();const g=G[id];if(!g)return;pop=document.createElement("div");pop.className="pop";pop.setAttribute("role","dialog");pop.setAttribute("aria-label","Meaning of "+g[0]);
 const t=tr(id);pop.innerHTML=`<div class="row" style="justify-content:space-between"><span class="w">${esc(g[0])}</span>${listenBtn(g[0]+". "+g[1])}</div>${t?`<div class="tr" style="color:var(--purple);font-weight:700">${esc(t)}</div>`:""}<p style="margin:.3rem 0">${esc(g[1])}</p><p class="small muted" style="margin:0"><i>Example:</i> ${esc(g[2])}</p><div class="row" style="margin-top:.5rem"><button class="btn plain" data-closepop>Close</button></div>`;
 document.body.appendChild(pop);const r=anchor.getBoundingClientRect();const w=pop.offsetWidth,h=pop.offsetHeight;let x=Math.min(Math.max(8,r.left),window.innerWidth-w-8);let y=r.bottom+8;if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-8);pop.style.left=x+"px";pop.style.top=y+"px";pop.querySelector("[data-closepop]").focus();}

/* ---------- animations cleanup ---------- */
let anims=[];
function stopAnims(){anims.forEach(f=>{try{f()}catch(e){}});anims=[];}

 if(id==="celltypes")return `<div class="viz"><svg viewBox="0 0 560 240" role="img" aria-label="A small prokaryotic cell with no nucleus next to a larger eukaryotic cell with a nucleus">

 // diffusion
 const dv=$("#difViz");if(dv){let parts=[],raf=0,playing=false;const g=$("#difDots");
  const reset=()=>{parts=[];for(let i=0;i<40;i++)parts.push({x:15+Math.random()*145,y:15+Math.random()*130});draw();};

   const caps={animal:{hypo:"Hypotonic: less solute outside. Water moves IN. The animal cell swells and may burst.",iso:"Isotonic: same solute inside and outside. Water moves in and out equally. The cell stays the same size.",hyper:"Hypertonic: more solute outside. Water moves OUT. The animal cell shrinks and wrinkles."},plant:{hypo:"Hypotonic: water moves IN. The cell wall stops it from bursting. The plant cell becomes firm (turgid). This is healthy for plants.",iso:"Isotonic: no net water movement. The plant cell is a little soft (flaccid).",hyper:"Hypertonic: water moves OUT. The membrane pulls away from the wall (plasmolysis). The plant wilts."}};

   $("#pumpSvg").innerHTML=`<svg viewBox="0 0 400 250" role="img" aria-label="${esc(caps[step])}"><rect x="0" y="0" width="400" height="80" fill="#EAF3FF"/><rect x="0" y="180" width="400" height="70" fill="#FFF4E5"/><text x="8" y="72" font-size="12" fill="#52606A">OUTSIDE: lots of Na⁺</text><text x="8" y="244" font-size="12" fill="#52606A">INSIDE: lots of K⁺</text><rect x="0" y="80" width="400" height="100" fill="#FDE7C8"/><rect x="160" y="74" width="80" height="112" rx="16" fill="#0F766E"/>${cav}${ions}</svg>`;
   $("#pumpCap").textContent=caps[step];$("#pumpNum").textContent=`Step ${step+1} of 4`;$("#pumpPrev").disabled=step===0;$("#pumpNext").textContent=step===3?"↺ Start again":"Next step ▶";};
  $("#pumpNext").onclick=()=>{step=step===3?0:step+1;draw();};$("#pumpPrev").onclick=()=>{if(step>0)step--;draw();};draw();}

function blob(cx,cy,r){let d="";for(let i=0;i<=24;i++){const a=i/24*Math.PI*2;const rr=r+(i%2?4:-3);d+=(i?"L":"M")+(cx+Math.cos(a)*rr).toFixed(1)+" "+(cy+Math.sin(a)*rr*.85).toFixed(1)+" ";}return d+"Z";}
